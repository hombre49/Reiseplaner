/* =====================================================================
   Ausgabe: Bausteine wählen → ein neutrales Berichtsmodell → je Format ein Baustein
   (Vorschau, Text, PDF, Word, Excel, CSV, Kalender). Neues Format = neuer Baustein.
   ===================================================================== */
const PARTS = [["overview", "Übersicht & Zeitleiste"], ["transports", "Verkehr"], ["accommodations", "Unterkünfte"], ["places", "Orte"], ["excursions", "Ausflüge"], ["itinerary", "Tagesplan"], ["expenses", "Ausgaben"], ["packing", "Packliste"], ["emergency", "Notfallkarte (EMERGENCY)"]];
const PRESETS = [
  { k: "komplett", l: "Komplette Reise", parts: PARTS.map((p) => p[0]).filter((k) => k !== "emergency"), paidOnly: false, notes: true },
  { k: "notfall", l: "Notfallkarte zum Mitnehmen", parts: ["emergency"], paidOnly: false, notes: true },
  { k: "unterwegs", l: "Unterlagen für unterwegs", parts: ["transports", "accommodations", "excursions", "itinerary"], paidOnly: false, notes: true },
  { k: "packliste", l: "Packliste zum Abhaken", parts: ["packing"], paidOnly: false, notes: false },
  { k: "kosten", l: "Kostenabrechnung", parts: ["expenses"], paidOnly: true, notes: false },
];
const repDefaults = (t, k = "komplett") => { const p = PRESETS.find((x) => x.k === k); return { preset: k, parts: new Set(p.parts), from: "", to: "", paidOnly: p.paidOnly, notes: p.notes }; }; // leerer Zeitraum = alles, auch Anreise und Vorab-Buchungen

/** Zelle: Text oder { eur: Zahl } für Beträge */
const cellText = (c) => (c && typeof c === "object" ? fMoney(c.eur) : String(c ?? ""));
const withNote = (text, note, o) => (o.notes && note ? `${text}\n${note}` : text);

function buildReport(t, o) {
  const inR = (d) => d && (!o.from || d >= o.from) && (!o.to || d <= o.to);
  const deD = (s) => (s ? isoToDe(s.slice(0, 10)) : "");
  const tOf = (s) => (s && s.length > 10 ? s.slice(11, 16) : "");
  const secs = [];

  if (o.parts.has("overview")) {
    const ev = [];
    for (const x of of("transports")) {
      if (x.type === "PARKING") { ev.push({ at: x.departAt, what: `Parken, Einfahrt: ${x.fromLocation}`, more: x.bookingRef || "" }); if (x.arriveAt) ev.push({ at: x.arriveAt, what: `Parken, Ausfahrt: ${x.fromLocation}`, more: "" }); continue; }
      ev.push({ at: x.departAt, what: `${TYPES[x.type]}${x.journeyId && journeyOf(x.id).length > 1 ? ` (${legLabel(x)})` : ""}: ${x.fromLocation} → ${x.toLocation}`, more: [x.carrier, x.number].filter(Boolean).join(" ") });
    }
    for (const x of of("parking")) { ev.push({ at: x.startAt, what: `Parken, Einfahrt: ${x.name}`, more: x.bookingRef || "" }); ev.push({ at: x.endAt, what: `Parken, Ausfahrt: ${x.name}`, more: "" }); }
    for (const x of of("excursions")) ev.push({ at: x.date + (x.startTime ? "T" + x.startTime : ""), what: `Ausflug: ${x.title}`, more: x.meetingPoint ? "Treffpunkt: " + x.meetingPoint : "" });
    for (const a of of("accommodations")) { ev.push({ at: a.checkIn, what: `Check-in: ${a.name}`, more: a.address || "" }); ev.push({ at: a.checkOut, what: `Check-out: ${a.name}`, more: "" }); }
    for (const i of of("itinerary")) ev.push({ at: i.date + (i.startTime ? "T" + i.startTime : ""), what: i.title, more: db.places.find((p) => p.id === i.placeId)?.name || "" });
    const list = ev.filter((e) => inR(e.at.slice(0, 10))).sort((a, b) => a.at.localeCompare(b.at));
    const blocks = [{ t: "kv", rows: [["Reiseziel", t.destination || "–"], ["Zeitraum", `${fDate(t.startDate)} – ${fDate(t.endDate)}`], ["Dauer", `${days(t.startDate, t.endDate).length} Tage`], ...(num(t.budgetTotal) ? [["Budget", fMoney(num(t.budgetTotal))]] : [])] }];
    if (o.notes && t.notes) blocks.push({ t: "para", text: t.notes });
    const byDay = {};
    for (const e of list) (byDay[e.at.slice(0, 10)] ||= []).push(e);
    for (const [d, l] of Object.entries(byDay)) {
      blocks.push({ t: "sub", text: fDate(d) });
      blocks.push({ t: "table", cols: [{ h: "Zeit", w: 12 }, { h: "Was", w: 58 }, { h: "Details", w: 30 }], rows: l.map((e) => [tOf(e.at) || "–", e.what, e.more]) });
    }
    if (!list.length) blocks.push({ t: "empty", text: "Im gewählten Zeitraum stehen keine Termine." });
    secs.push({ key: "overview", title: "Übersicht", blocks, data: { cols: [{ h: "Datum", wch: 12 }, { h: "Zeit", wch: 7 }, { h: "Was", wch: 44 }, { h: "Details", wch: 26 }], rows: list.map((e) => [deD(e.at), tOf(e.at), e.what, e.more]) } });
  }

  if (o.parts.has("transports")) {
    const legs = of("transports").filter((x) => inR(x.departAt.slice(0, 10)));
    const groups = journeys(legs.sort(SORT.transports)).map((g) => g.filter((l) => legs.includes(l))).filter((g) => g.length);
    const rows = [], data = [];
    for (const g of groups) for (const x of g) {
      const label = journeyOf(x.id).length > 1 ? legLabel(x) : "";
      rows.push([`${label ? label + "\n" : ""}${TYPES[x.type]} ${[x.carrier, x.number].filter(Boolean).join(" ")}`.trim(), withNote(x.type === "PARKING" ? [x.fromLocation, x.toLocation !== x.fromLocation && x.toLocation, x.number && "Kennzeichen " + x.number].filter(Boolean).join("\n") : `${x.fromLocation} → ${x.toLocation}`, x.notes, o), dtShort(x.departAt), x.arriveAt ? dtShort(x.arriveAt) : "–", [x.bookingRef, x.seat && "Sitz " + x.seat].filter(Boolean).join("\n"), num(x.price) ? { eur: num(x.price) } : ""]);
      data.push([label || "Fahrt", TYPES[x.type], x.carrier || "", x.number || "", x.fromLocation, x.toLocation, deD(x.departAt), tOf(x.departAt), deD(x.arriveAt), tOf(x.arriveAt), x.bookingRef || "", x.seat || "", num(x.price) || null, ...(o.notes ? [x.notes || ""] : [])]);
    }
    const pks = of("parking").filter((x) => (!o.to || x.startAt.slice(0, 10) <= o.to) && (!o.from || x.endAt.slice(0, 10) >= o.from)).sort((a, b) => a.startAt.localeCompare(b.startAt));
    const tBlocks = rows.length ? [{ t: "table", cols: [{ h: "Fahrt", w: 20 }, { h: "Strecke", w: 28 }, { h: "Abfahrt", w: 15 }, { h: "Ankunft", w: 15 }, { h: "Buchung · Sitz", w: 12 }, { h: "Preis", w: 10, r: 1 }], rows }] : [{ t: "empty", text: "Keine Fahrten im gewählten Zeitraum." }];
    if (pks.length) tBlocks.push({ t: "sub", text: "Parken" }, { t: "table", cols: [{ h: "Parkhaus", w: 30 }, { h: "Einfahrt", w: 17 }, { h: "Ausfahrt", w: 17 }, { h: "Buchung · Kennz.", w: 22 }, { h: "Preis", w: 14, r: 1 }],
      rows: pks.map((x) => [withNote([x.name, x.address].filter(Boolean).join("\n"), x.notes, o), dtShort(x.startAt), dtShort(x.endAt), [x.bookingRef, x.plate].filter(Boolean).join("\n"), num(x.price) ? { eur: num(x.price) } : ""]) });
    secs.push({ key: "transports", title: "Verkehr", blocks: tBlocks,
      data2: pks.length ? { name: "Parken", cols: [{ h: "Parkhaus", wch: 26 }, { h: "Adresse", wch: 28 }, { h: "Einfahrt Datum" }, { h: "Einfahrt Uhrzeit" }, { h: "Ausfahrt Datum" }, { h: "Ausfahrt Uhrzeit" }, { h: "Tage" }, { h: "Buchungscode" }, { h: "Kennzeichen" }, { h: "Preis EUR", eur: 1 }, ...(o.notes ? [{ h: "Notizen", wch: 30 }] : [])],
        rows: pks.map((x) => [x.name, x.address || "", deD(x.startAt), tOf(x.startAt), deD(x.endAt), tOf(x.endAt), parkDays(x), x.bookingRef || "", x.plate || "", num(x.price) || null, ...(o.notes ? [x.notes || ""] : [])]) } : null,
      data: { cols: [{ h: "Fahrt" }, { h: "Art" }, { h: "Anbieter" }, { h: "Nummer" }, { h: "Von", wch: 22 }, { h: "Nach", wch: 22 }, { h: "Abfahrt Datum" }, { h: "Abfahrt Uhrzeit" }, { h: "Ankunft Datum" }, { h: "Ankunft Uhrzeit" }, { h: "Buchungscode" }, { h: "Sitz" }, { h: "Preis EUR", eur: 1 }, ...(o.notes ? [{ h: "Notizen", wch: 30 }] : [])], rows: data } });
  }

  if (o.parts.has("accommodations")) {
    const list = of("accommodations").filter((a) => (!o.to || a.checkIn.slice(0, 10) <= o.to) && (!o.from || a.checkOut.slice(0, 10) >= o.from)).sort(SORT.accommodations);
    const nights = (a) => Math.max(0, Math.round((D(a.checkOut.slice(0, 10)) - D(a.checkIn.slice(0, 10))) / 864e5));
    secs.push({ key: "accommodations", title: "Unterkünfte",
      blocks: list.length ? [{ t: "table", cols: [{ h: "Unterkunft", w: 32 }, { h: "Check-in", w: 15 }, { h: "Check-out", w: 15 }, { h: "Nächte", w: 8, r: 1 }, { h: "Buchung · Telefon", w: 18 }, { h: "Preis", w: 12, r: 1 }],
        rows: list.map((a) => [withNote([a.name, a.address].filter(Boolean).join("\n"), a.notes, o), dtShort(a.checkIn), dtShort(a.checkOut), String(nights(a)), [a.bookingRef, a.phone].filter(Boolean).join("\n"), num(a.price) ? { eur: num(a.price) } : ""]) }] : [{ t: "empty", text: "Keine Unterkünfte im gewählten Zeitraum." }],
      data: { cols: [{ h: "Name", wch: 26 }, { h: "Adresse", wch: 30 }, { h: "Check-in Datum" }, { h: "Check-in Uhrzeit" }, { h: "Check-out Datum" }, { h: "Check-out Uhrzeit" }, { h: "Nächte" }, { h: "Buchungscode" }, { h: "Telefon" }, { h: "Website", wch: 24 }, { h: "Preis EUR", eur: 1 }, ...(o.notes ? [{ h: "Notizen", wch: 30 }] : [])],
        rows: list.map((a) => [a.name, a.address || "", deD(a.checkIn), tOf(a.checkIn), deD(a.checkOut), tOf(a.checkOut), nights(a), a.bookingRef || "", a.phone || "", a.url || "", num(a.price) || null, ...(o.notes ? [a.notes || ""] : [])]) } });
  }

  if (o.parts.has("places")) {
    const list = of("places").sort(SORT.places);
    secs.push({ key: "places", title: "Sehenswürdigkeiten",
      blocks: list.length ? [{ t: "table", cols: [{ h: "Ort", w: 30 }, { h: "Kategorie", w: 16 }, { h: "Adresse", w: 40 }, { h: "Besucht", w: 14 }], rows: list.map((p) => [withNote(p.name, p.notes, o), p.category || "", p.address || "", p.visited ? "ja" : "–"]) }] : [{ t: "empty", text: "Noch keine Sehenswürdigkeiten gesammelt." }],
      data: { cols: [{ h: "Name", wch: 26 }, { h: "Kategorie" }, { h: "Adresse", wch: 30 }, { h: "Website", wch: 24 }, { h: "Besucht" }, ...(o.notes ? [{ h: "Notizen", wch: 30 }] : [])], rows: list.map((p) => [p.name, p.category || "", p.address || "", p.url || "", p.visited ? "ja" : "nein", ...(o.notes ? [p.notes || ""] : [])]) } });
  }

  if (o.parts.has("excursions")) {
    const list = of("excursions").filter((x) => inR(x.date)).sort(SORT.excursions);
    const when = (x) => `${fShort(x.date)}${x.startTime ? "\n" + x.startTime + (x.endTime ? "–" + x.endTime : "") : ""}`;
    secs.push({ key: "excursions", title: "Gebuchte Ausflüge",
      blocks: list.length ? [{ t: "table", cols: [{ h: "Wann", w: 15 }, { h: "Ausflug", w: 35 }, { h: "Treffpunkt", w: 20 }, { h: "Buchung · Personen", w: 18 }, { h: "Preis", w: 12, r: 1 }],
        rows: list.map((x) => [when(x), withNote([x.title, x.provider].filter(Boolean).join("\n"), x.notes, o), x.meetingPoint || "", [x.bookingRef, x.persons && x.persons + " Pers.", x.phone].filter(Boolean).join("\n"), num(x.price) ? { eur: num(x.price) } : ""]) }] : [{ t: "empty", text: "Keine Ausflüge im gewählten Zeitraum." }],
      data: { cols: [{ h: "Datum" }, { h: "Beginn" }, { h: "Ende" }, { h: "Ausflug", wch: 30 }, { h: "Anbieter", wch: 20 }, { h: "Treffpunkt", wch: 22 }, { h: "Buchungscode" }, { h: "Personen" }, { h: "Telefon" }, { h: "Website", wch: 24 }, { h: "Preis EUR", eur: 1 }, ...(o.notes ? [{ h: "Notizen", wch: 30 }] : [])],
        rows: list.map((x) => [isoToDe(x.date), x.startTime || "", x.endTime || "", x.title, x.provider || "", x.meetingPoint || "", x.bookingRef || "", x.persons || "", x.phone || "", x.url || "", num(x.price) || null, ...(o.notes ? [x.notes || ""] : [])]) } });
  }

  if (o.parts.has("itinerary")) {
    const auto = autoItems();
    const blocks = [], data = [];
    for (const { d, label } of planDays(t, auto)) {
      if (!inR(d)) continue;
      const l = dayList(d, of("itinerary"), auto);
      blocks.push({ t: "sub", text: `${label} · ${fDate(d)}` });
      if (!l.length) { blocks.push({ t: "empty", text: "Noch nichts geplant." }); continue; }
      const row = (it) => it.own
        ? [it.x.startTime ? it.x.startTime + (it.x.endTime ? "–" + it.x.endTime : "") : "–", withNote(it.x.title, it.x.notes, o), db.places.find((p) => p.id === it.x.placeId)?.name || ""]
        : [it.a.start ? it.a.start + (it.a.end ? "–" + it.a.end : "") : "–", it.a.title, it.a.sub];
      blocks.push({ t: "table", cols: [{ h: "Zeit", w: 16 }, { h: "Programm", w: 50 }, { h: "Ort · Details", w: 34 }], rows: l.map(row) });
      for (const it of l) { const r = row(it); data.push([label, isoToDe(d), r[0], r[1].split("\n")[0], r[2], it.own ? "Tagesplan" : SRC_LABEL[it.a.src], ...(o.notes ? [it.own ? it.x.notes || "" : ""] : [])]); }
    }
    secs.push({ key: "itinerary", title: "Tagesplan", blocks: blocks.length ? blocks : [{ t: "empty", text: "Keine Tage im gewählten Zeitraum." }],
      data: { cols: [{ h: "Tag" }, { h: "Datum" }, { h: "Zeit" }, { h: "Programm", wch: 34 }, { h: "Ort · Details", wch: 26 }, { h: "Quelle" }, ...(o.notes ? [{ h: "Notizen", wch: 30 }] : [])], rows: data } });
  }

  if (o.parts.has("expenses")) {
    const s = budgetSummary(t);
    const items = s.items.filter((e) => (!e.date || inR(e.date)) && (!o.paidOnly || e.status === "PAID"));
    const sum = (l) => l.reduce((a, e) => a + e.eur, 0);
    const paid = sum(items.filter((e) => e.status === "PAID")), planned = sum(items.filter((e) => e.status === "PLANNED"));
    const cats = s.cats.map((c) => { const l = items.filter((e) => e.category === c.name); return { ...c, paid: sum(l.filter((e) => e.status === "PAID")), planned: sum(l.filter((e) => e.status === "PLANNED")) }; }).filter((c) => c.budget || c.paid || c.planned);
    const used = paid + planned;
    const kv = [["Budget", s.budget ? fMoney(s.budget) : "nicht festgelegt"], ["Bezahlt", fMoney(paid)], ...(o.paidOnly ? [] : [["Noch zu bezahlen", fMoney(planned)]]), ...(s.budget ? [[used > s.budget ? "Überschritten um" : "Noch nicht verplant", fMoney(Math.abs(s.budget - used))]] : [])];
    if (o.from || o.to) kv.push(["Zeitraum", `${o.from ? isoToDe(o.from) : "Anfang"} – ${o.to ? isoToDe(o.to) : "Ende"}`]);
    const blocks = [{ t: "kv", rows: kv }];
    if (cats.length) blocks.push({ t: "sub", text: "Nach Kategorie" }, { t: "table", cols: [{ h: "Kategorie", w: 34 }, { h: "Budget", w: 16, r: 1 }, { h: "Bezahlt", w: 16, r: 1 }, ...(o.paidOnly ? [] : [{ h: "Offen", w: 16, r: 1 }]), { h: "Zusammen", w: 18, r: 1 }], rows: cats.map((c) => [c.name, c.budget ? { eur: c.budget } : "–", { eur: c.paid }, ...(o.paidOnly ? [] : [{ eur: c.planned }]), { eur: c.paid + c.planned }]) });
    blocks.push({ t: "sub", text: o.paidOnly ? "Bezahlte Ausgaben" : "Alle Ausgaben" });

      rows: items.map((e) => [e.date ? isoToDe(e.date) : "", e.title + (e.currency && e.currency !== "EUR" ? `\n${fNum(e.amount)} ${e.currency}` : ""), e.category, e.status === "PAID" ? `bezahlt\n${e.paymentMethod === "CASH" ? "bar" : "Karte"}` : "offen", { eur: e.eur }]) } : { t: "empty", text: "Keine Ausgaben im gewählten Zeitraum." });
    secs.push({ key: "expenses", title: o.paidOnly ? "Kostenabrechnung" : "Ausgaben", blocks,
      data: { cols: [{ h: "Datum" }, { h: "Wofür", wch: 30 }, { h: "Kategorie", wch: 22 }, { h: "Status" }, { h: "Zahlart" }, { h: "Betrag", eur: 0 }, { h: "Währung" }, { h: "Betrag EUR", eur: 1 }, { h: "Herkunft", wch: 16 }],
        rows: items.map((e) => [e.date ? isoToDe(e.date) : "", e.title, e.category, e.status === "PAID" ? "bezahlt" : "offen", e.status === "PAID" ? (e.paymentMethod === "CASH" ? "bar" : "Karte") : "", num(e.amount), e.currency || "EUR", Math.round(e.eur * 100) / 100, e.sourceType ? (e.sourceType === "accommodations" ? "aus Unterkünften" : "aus Verkehr") : "erfasst"]) },
      data2: { name: "Kategorien", cols: [{ h: "Kategorie", wch: 26 }, { h: "Budget EUR", eur: 1 }, { h: "Bezahlt EUR", eur: 1 }, { h: "Offen EUR", eur: 1 }, { h: "Zusammen EUR", eur: 1 }], rows: cats.map((c) => [c.name, c.budget || null, Math.round(c.paid * 100) / 100, Math.round(c.planned * 100) / 100, Math.round((c.paid + c.planned) * 100) / 100]) } });
  }

  if (o.parts.has("packing")) {
    const items = of("packing");

    secs.push({ key: "packing", title: "Packliste", blocks: g.length ? [{ t: "check", groups: g }] : [{ t: "empty", text: "Die Packliste ist leer." }],

  }

  if (o.parts.has("emergency")) {
    const blocks = [], data = [];
    const L2 = (k) => `${EML[k][0]} / ${EML[k][1]}`;
    for (const p of profile.persons || []) {
      blocks.push({ t: "sub", text: p.name || "Person" });

        [L2("doctor"), [p.doctorName, p.doctorPhone].filter(Boolean).join(", ")], [L2("ins"), [p.insName, p.insNumber && "Nr. " + p.insNumber].filter(Boolean).join(", ")],
        [L2("travelIns"), [p.tiName, p.tiNumber && "Nr. " + p.tiNumber, p.tiPhone && "Notruf/Hotline " + p.tiPhone].filter(Boolean).join(", ")], [L2("lang"), p.lang], [L2("notes"), p.notes]].filter((r) => r[1]);
      if (kv.length) blocks.push({ t: "kv", rows: kv });
      if (p.meds?.length) blocks.push({ t: "table", cols: [{ h: L2("meds"), w: 45 }, { h: "Dosis / Dose", w: 25 }, { h: "Einnahme / When", w: 30 }], rows: p.meds.map((m) => [m.name, m.dose, m.when]) });

    if (tkv.length) { blocks.push({ t: "sub", text: `Für diese Reise / For this trip: ${t.title}` }, { t: "kv", rows: tkv }); for (const [k, v] of tkv) data.push(["Reise / Trip", k, v]); }

}

/* ---------- Baustein: Vorschau (HTML) ---------- */
function reportHtml(r) {
  const block = (b) => {
    if (b.t === "kv") return `<div class="kv">${b.rows.map(([k, v]) => `<b>${esc(k)}</b><span>${esc(v)}</span>`).join("")}</div>`;
    if (b.t === "para") return b.text.split(/\n+/).map((x) => `<p class="just" lang="de">${esc(x)}</p>`).join("");
    if (b.t === "sub") return `<h4>${esc(b.text)}</h4>`;
    if (b.t === "empty") return `<p class="muted small">${esc(b.text)}</p>`;
    if (b.t === "table") return `<div class="tablewrap"><table><thead><tr>${b.cols.map((c) => `<th class="${c.r ? "r" : ""}" style="width:${c.w}%">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map((row) => `<tr>${row.map((c, i) => `<td class="${b.cols[i].r ? "r" : ""}">${esc(cellText(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    if (b.t === "check") return b.groups.map((g) => `<h4>${esc(g.title)}</h4><ul class="cl">${g.items.map((i) => `<li><span class="box">${i.done ? "✓" : ""}</span>${esc(i.text)}</li>`).join("")}</ul>`).join("");
    return "";
  };
  return `<div class="paper"><div class="pagehead"><span>${esc(r.title)} · ${esc(r.label)}</span><span>${esc(r.range)} · Stand ${new Date().toLocaleDateString("de-DE")}</span></div>
    <h2>${esc(r.title)}</h2><p class="muted" style="margin:4px 0 18px">${esc(r.subtitle)}</p>
    ${r.sections.length ? r.sections.map((s) => `<section class="rep-sec"><h3>${esc(s.title)}</h3>${s.blocks.map(block).join("")}</section>`).join("") : `<p class="muted">Bitte mindestens einen Baustein auswählen.</p>`}</div>`;
}

/* ---------- Baustein: Text ---------- */
function reportText(r) {
  const out = [r.title, r.subtitle, ""];
  for (const s of r.sections) {
    out.push(`== ${s.title.toUpperCase()} ==`);
    for (const b of s.blocks) {
      if (b.t === "kv") b.rows.forEach(([k, v]) => out.push(`${k}: ${v}`));
      else if (b.t === "para" || b.t === "empty") out.push(b.text);
      else if (b.t === "sub") out.push("", `-- ${b.text} --`);
      else if (b.t === "table") b.rows.forEach((row) => out.push("• " + row.map((c) => cellText(c).replace(/\n/g, ", ")).filter(Boolean).join(" | ")));
      else if (b.t === "check") b.groups.forEach((g) => { out.push("", g.title + ":"); g.items.forEach((i) => out.push(`[${i.done ? "x" : " "}] ${i.text}`)); });
    }
    out.push("");
  }
  return out.join("\n");
}

/* ---------- Excel ohne Fremdbibliothek: eigene SpreadsheetML-Teile, gepackt mit JSZip ---------- */
function xlsxParts(r) {
  const x = (v) => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const col = (i) => { let s = ""; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const sheets = [];
  for (const s of r.sections) { if (s.data) sheets.push([s.title, s.data]); if (s.data2) sheets.push([s.data2.name, s.data2]); }
  const used = new Set();
  const names = sheets.map(([n]) => { let b = n.replace(/[\[\]:*?\/\\]/g, "").slice(0, 31) || "Blatt", k = 2, v = b; while (used.has(v)) v = `${b.slice(0, 28)} ${k++}`; used.add(v); return v; });
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files = {};
  sheets.forEach(([, d], si) => {
    const rows = [d.cols.map((c) => c.h), ...d.rows];
    const body = rows.map((row, ri) => `<row r="${ri + 1}">${row.map((v, ci) => {
      const ref = col(ci) + (ri + 1);
      if (v === null || v === undefined || v === "") return "";
      if (ri > 0 && typeof v === "number" && Number.isFinite(v)) { const c = d.cols[ci] || {}; const st = "eur" in c ? (c.eur ? 2 : 3) : 0; return `<c r="${ref}"${st ? ` s="${st}"` : ""}><v>${v}</v></c>`; }
      return `<c r="${ref}" t="inlineStr"${ri === 0 ? ' s="1"' : ""}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
    }).join("")}</row>`).join("");
    const cols = d.cols.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.wch || Math.max(10, c.h.length + 2)}" customWidth="1"/>`).join("");
    files[`xl/worksheets/sheet${si + 1}.xml`] = `${XML}<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${body}</sheetData></worksheet>`;
  });
  files["[Content_Types].xml"] = `${XML}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`;
  files["_rels/.rels"] = `${XML}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  files["xl/workbook.xml"] = `${XML}<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n, i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`;
  files["xl/_rels/workbook.xml.rels"] = `${XML}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${names.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  files["xl/styles.xml"] = `${XML}<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00\\ &quot;€&quot;"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  return files;
}
async function makeXlsxOwn(r) {
  const zip = new window.JSZip();
  for (const [k, v] of Object.entries(xlsxParts(r))) zip.file(k, v);

/* ---------- Webfassung: normale Downloads und Druckdialog ---------- */
function webDownload(filename, data, note) {
  const ext = filename.split(".").pop();
  const types = { pdf: "application/pdf", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", csv: "text/csv;charset=utf-8", ics: "text/calendar;charset=utf-8", zip: "application/zip", json: "application/json" };
  const blob = data instanceof Blob ? data : new Blob([data], { type: types[ext] || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  note(`„${filename}“ wurde heruntergeladen. Auf dem iPad meist in der Dateien-App unter „Downloads“.`);
}
function webPrint() {
  document.body.classList.add("print-report");
  setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove("print-report"), 500); }, 50);
}

function loadLib(k) {
  if (k === "jszip" && window.JSZip) return Promise.resolve();
  return (libP[k] ||= new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = LIBS[k];
    sc.onload = () => res();
    sc.onerror = () => { delete libP[k]; rej(new Error("lib")); };
    document.head.appendChild(sc);
  }));
}

/* ---------- Baustein: PDF (A4, Kopf- und Fußzeile, Blocksatz) ---------- */
const pdfSafe = (x) => String(x ?? "").replace(/→/g, "->").replace(/[✓✔]/g, "x").replace(/×/g, "x").replace(/[^\x00-\xFF€–—‚„“”‘’•…‰]/g, "");
async function makePdf(r) {
  await loadLib("jspdf");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const M = 18, W = 210 - 2 * M, TOP = 24, BOTTOM = 279;
  const INK = [22, 32, 29], MUTED = [93, 107, 102], ACC = [15, 92, 82], LINE = [211, 218, 215], SUNK = [230, 234, 232];
  const lh = (pt) => pt * 0.3528 * 1.3;
  let y = TOP;
  const font = (style, size, color = INK) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...color); };
  const page = () => { doc.addPage(); y = TOP; };
  const ensure = (h) => { if (y + h > BOTTOM) page(); };
  const lines = (text, width) => pdfSafe(text).split("\n").flatMap((p) => (p ? doc.splitTextToSize(p, width) : [""]));

  font("bold", 20, ACC); doc.text(pdfSafe(r.title), M, y + 4); y += 11;
  font("normal", 10.5, MUTED); doc.text(pdfSafe(r.subtitle), M, y); y += 9;

  r.sections.forEach((s, si) => {
    if (si > 0) page();
    font("bold", 15, ACC); doc.text(pdfSafe(s.title), M, y + 2); y += 4;
    doc.setDrawColor(...ACC); doc.setLineWidth(0.4); doc.line(M, y, M + W, y); y += 6;
    for (const b of s.blocks) {
      if (b.t === "sub") { ensure(14); y += 2; font("bold", 11, ACC); doc.text(pdfSafe(b.text), M, y); y += 5; }
      else if (b.t === "empty") { ensure(7); font("italic", 9.5, MUTED); doc.text(pdfSafe(b.text), M, y); y += 6; }
      else if (b.t === "para") {
        font("normal", 10);
        for (const par of b.text.split(/\n+/)) {
          const ls = doc.splitTextToSize(pdfSafe(par), W);
          ensure(ls.length * lh(10));
          // Blocksatz; jsPDF setzt die letzte Zeile des Absatzes linksbündig
          doc.text(ls, M, y, { maxWidth: W, align: "justify" });
          y += ls.length * lh(10) + 2;
        }
      } else if (b.t === "kv") {
        for (const [k, v] of b.rows) {
          font("normal", 10); const vl = lines(v, W - 42); ensure(vl.length * lh(10));
          font("bold", 10); doc.text(pdfSafe(k), M, y);
          font("normal", 10); doc.text(vl, M + 42, y); y += vl.length * lh(10) + 0.8;
        }
        y += 2;
      } else if (b.t === "check") {
        for (const g of b.groups) {
          ensure(12); font("bold", 10.5, ACC); doc.text(pdfSafe(g.title), M, y); y += 5.5;
          for (const it of g.items) {
            ensure(6); doc.setDrawColor(...INK); doc.setLineWidth(0.3); doc.rect(M, y - 3.3, 3.6, 3.6);
            if (it.done) { doc.setLineWidth(0.5); doc.line(M + 0.7, y - 1.5, M + 1.6, y - 0.4); doc.line(M + 1.6, y - 0.4, M + 3.1, y - 2.9); }
            font("normal", 10, it.done ? MUTED : INK); doc.text(pdfSafe(it.text), M + 6, y); y += 5.6;
          }
          y += 2;
        }
      } else if (b.t === "table") {
        const tot = b.cols.reduce((a, c) => a + c.w, 0);
        const ws = b.cols.map((c) => (W * c.w) / tot);
        const pad = 1.6, fs = 8.6, L = lh(fs);
        const drawRow = (cells, head) => {
          font(head ? "bold" : "normal", fs);
          const ls = cells.map((c, i) => lines(cellText(c), ws[i] - 2 * pad));
          const h = Math.max(...ls.map((x) => x.length)) * L + 2 * pad;
          if (y + h > BOTTOM) { page(); if (!head) drawRow(b.cols.map((c) => c.h), true); font("normal", fs); }
          if (head) { doc.setFillColor(...SUNK); doc.rect(M, y, W, h, "F"); }
          let x = M;
          ls.forEach((cl, i) => {
            cl.forEach((t, j) => {
              const ty = y + pad + L * (j + 1) - 0.9;
              if (b.cols[i].r) doc.text(t, x + ws[i] - pad, ty, { align: "right" }); else doc.text(t, x + pad, ty);
            });
            x += ws[i];
          });
          y += h;
          doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M, y, M + W, y);
        };
        ensure(16);
        drawRow(b.cols.map((c) => c.h), true);
        for (const row of b.rows) drawRow(row, false);
        y += 4;
      }
    }
  });

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    font("normal", 8, MUTED);
    doc.text(pdfSafe(`${r.title} · ${r.label}`), M, 12);
    doc.text(pdfSafe(`Stand ${new Date().toLocaleDateString("de-DE")}`), M + W, 12, { align: "right" });
    doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M, 14, M + W, 14);
    doc.text(`Seite ${i} von ${n}`, M + W, 289, { align: "right" });
  }
  return doc.output("arraybuffer");
}

/* ---------- Baustein: Word (.docx, eigene XML-Teile, gepackt mit JSZip) ---------- */
function docxParts(r) {
  const x = (v) => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const runs = (text, b) => String(text ?? "").split("\n").map((ln, i) => `${i ? "<w:r><w:br/></w:r>" : ""}<w:r>${b ? "<w:rPr><w:b/></w:rPr>" : ""}<w:t xml:space="preserve">${x(ln)}</w:t></w:r>`).join("");
  const p = (text, style, o = {}) => `<w:p><w:pPr>${style ? `<w:pStyle w:val="${style}"/>` : ""}${o.jc ? `<w:jc w:val="${o.jc}"/>` : ""}</w:pPr>${runs(text, o.b)}</w:p>`;
  const W = 9638;
  const border = '<w:top w:val="single" w:sz="4" w:space="0" w:color="D3DAD7"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="D3DAD7"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="D3DAD7"/>';
  const table = (b) => {
    const tot = b.cols.reduce((a, c) => a + c.w, 0);
    const ws = b.cols.map((c) => Math.round((W * c.w) / tot));
    const cell = (c, i, head) => `<w:tc><w:tcPr><w:tcW w:w="${ws[i]}" w:type="dxa"/>${head ? '<w:shd w:val="clear" w:color="auto" w:fill="E6EAE8"/>' : ""}</w:tcPr><w:p><w:pPr><w:spacing w:before="40" w:after="40"/>${b.cols[i].r ? '<w:jc w:val="right"/>' : ""}</w:pPr>${runs(head ? c : cellText(c), head)}</w:p></w:tc>`;
    return `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblBorders>${border}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${ws.map((w) => `<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`
      + `<w:tr><w:trPr><w:tblHeader/></w:trPr>${b.cols.map((c, i) => cell(c.h, i, true)).join("")}</w:tr>`
      + b.rows.map((row) => `<w:tr><w:trPr><w:cantSplit/></w:trPr>${row.map((c, i) => cell(c, i, false)).join("")}</w:tr>`).join("") + "</w:tbl>" + p("");
  };
  let body = p(r.title, "Title") + p(r.subtitle, "Subtitle");
  r.sections.forEach((s, i) => {
    if (i > 0) body += '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    body += p(s.title, "Heading1");
    for (const b of s.blocks) {
      if (b.t === "sub") body += p(b.text, "Heading2");
      else if (b.t === "para") body += b.text.split(/\n+/).map((t) => p(t, null, { jc: "both" })).join("");
      else if (b.t === "empty") body += p(b.text);
      else if (b.t === "kv") body += b.rows.map(([k, v]) => `<w:p><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">${x(k)}: </w:t></w:r>${runs(v)}</w:p>`).join("");
      else if (b.t === "table") body += table(b);
      else if (b.t === "check") for (const g of b.groups) body += p(g.title, "Heading3") + g.items.map((it) => p(`${it.done ? "☒" : "☐"}  ${it.text}`)).join("");
    }
  });
  const sect = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr>';
  const h = (id, name, lvl, sz, color, before) => `<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="${before}" w:after="120"/>${lvl >= 0 ? `<w:outlineLvl w:val="${lvl}"/>` : ""}</w:pPr><w:rPr><w:b/><w:color w:val="${color}"/><w:sz w:val="${sz}"/></w:rPr></w:style>`;
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return {
    "[Content_Types].xml": `${XML}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`,
    "_rels/.rels": `${XML}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`,
    "word/_rels/document.xml.rels": `${XML}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
    "word/document.xml": `${XML}<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}${sect}</w:body></w:document>`,
    "word/styles.xml": `${XML}<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="de-DE"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>`
      + `<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>`
      + h("Title", "Title", -1, 44, "0F5C52", 0) + `<w:style w:type="paragraph" w:styleId="Subtitle"><w:name w:val="Subtitle"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="240"/></w:pPr><w:rPr><w:color w:val="5D6B66"/><w:sz w:val="22"/></w:rPr></w:style>`
      + h("Heading1", "heading 1", 0, 32, "0F5C52", 120) + h("Heading2", "heading 2", 1, 24, "0F5C52", 200) + h("Heading3", "heading 3", 2, 22, "16201D", 160)
      + `</w:styles>`,
  };
}
async function makeDocx(r) {
  await loadLib("jszip");
  const zip = new window.JSZip();
  for (const [k, v] of Object.entries(docxParts(r))) zip.file(k, v);
  return zip.generateAsync({ type: "arraybuffer", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

/* ---------- Baustein: Excel (ein Blatt je Baustein, Beträge als Zahlen) ---------- */
async function makeXlsx(r) {
  await loadLib("xlsx");
  const X = window.XLSX;
  const wb = X.utils.book_new();
  const used = new Set();
  const sheet = (name, d) => {
    const aoa = [d.cols.map((c) => c.h), ...d.rows.map((row) => row.map((c) => (c == null ? "" : c)))];
    const ws = X.utils.aoa_to_sheet(aoa);
    ws["!cols"] = d.cols.map((c) => ({ wch: c.wch || Math.max(10, c.h.length + 2) }));
    d.cols.forEach((c, ci) => { if (!("eur" in c)) return; for (let ri = 1; ri < aoa.length; ri++) { const ref = X.utils.encode_cell({ r: ri, c: ci }); if (ws[ref] && typeof ws[ref].v === "number") ws[ref].z = c.eur ? '#,##0.00 "€"' : "#,##0.00"; } });
    let n = name.replace(/[\[\]:*?\/\\]/g, "").slice(0, 31), k = 2;
    while (used.has(n)) n = `${name.slice(0, 28)} ${k++}`;
    used.add(n);
    X.utils.book_append_sheet(wb, ws, n);
  };
  for (const s of r.sections) { sheet(s.title, s.data); if (s.data2) sheet(s.data2.name, s.data2); }
  return X.write(wb, { bookType: "xlsx", type: "array" });
}

/* ---------- Baustein: CSV (Semikolon, Dezimalkomma, für deutsches Excel) ---------- */
function csvOf(d) {
  const q = (v) => { const t = typeof v === "number" ? String(v).replace(".", ",") : String(v ?? ""); return /[";\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  return "\uFEFF" + [d.cols.map((c) => c.h), ...d.rows].map((row) => row.map(q).join(";")).join("\r\n");
}

/* ---------- Baustein: Kalender (.ics) ---------- */
function makeIcs(t, o) {
  const inR = (d) => (!o.from || d >= o.from) && (!o.to || d <= o.to);
  const esc2 = (v) => String(v ?? "").replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const dt = (s) => s.replace(/-/g, "").replace(":", "") + (s.length > 10 ? "00" : "");
  const out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Reiseplaner//DE", "CALSCALE:GREGORIAN", `X-WR-CALNAME:${esc2(t.title)}`];
  const ev = (id, start, end, summary, location, desc) => {
    out.push("BEGIN:VEVENT", `UID:${id}@reiseplaner`, `DTSTAMP:${stamp}`);
    if (start.length > 10) { out.push(`DTSTART:${dt(start)}`); out.push(end && end.length > 10 ? `DTEND:${dt(end)}` : "DURATION:PT1H"); }
    else { out.push(`DTSTART;VALUE=DATE:${dt(start)}`, `DTEND;VALUE=DATE:${dt(addDays(end && end > start ? end.slice(0, 10) : start, end && end.slice(0, 10) > start ? 0 : 1))}`); }
    out.push(`SUMMARY:${esc2(summary)}`);
    if (location) out.push(`LOCATION:${esc2(location)}`);
    if (desc) out.push(`DESCRIPTION:${esc2(desc)}`);
    out.push("END:VEVENT");
  };
  let n = 0;
  if (o.parts.has("transports")) for (const x of of("transports")) if (inR(x.departAt.slice(0, 10))) { n++;
    ev(x.id, x.departAt, x.arriveAt, x.type === "PARKING" ? `Parken: ${x.fromLocation}` : `${TYPES[x.type]} ${x.fromLocation} → ${x.toLocation}`, x.fromLocation, [[x.carrier, x.number].filter(Boolean).join(" "), x.bookingRef && "Buchung: " + x.bookingRef, x.seat && "Sitz: " + x.seat, o.notes && x.notes].filter(Boolean).join("\n")); }
  if (o.parts.has("accommodations")) for (const a of of("accommodations")) if ((!o.to || a.checkIn.slice(0, 10) <= o.to) && (!o.from || a.checkOut.slice(0, 10) >= o.from)) { n++;
    if (a.checkIn.length > 10) { ev(a.id + "-in", a.checkIn, "", `Check-in ${a.name}`, a.address, [a.bookingRef && "Buchung: " + a.bookingRef, a.phone && "Tel.: " + a.phone].filter(Boolean).join("\n")); ev(a.id + "-out", a.checkOut, "", `Check-out ${a.name}`, a.address, ""); }
    else ev(a.id, a.checkIn.slice(0, 10), a.checkOut.slice(0, 10), `Unterkunft: ${a.name}`, a.address, [a.bookingRef && "Buchung: " + a.bookingRef, a.phone && "Tel.: " + a.phone].filter(Boolean).join("\n")); }
  if (o.parts.has("transports")) for (const x of of("parking")) if ((!o.to || x.startAt.slice(0, 10) <= o.to) && (!o.from || x.endAt.slice(0, 10) >= o.from)) { n++;
    ev(x.id + "-in", x.startAt, "", `Parken, Einfahrt: ${x.name}`, x.address, [x.bookingRef && "Buchung: " + x.bookingRef, x.plate && "Kennzeichen: " + x.plate].filter(Boolean).join("\n"));
    ev(x.id + "-out", x.endAt, "", `Parken, Ausfahrt: ${x.name}`, x.address, ""); }
  if (o.parts.has("excursions")) for (const x of of("excursions")) if (inR(x.date)) { n++;
    ev(x.id, x.date + (x.startTime ? "T" + x.startTime : ""), x.endTime && x.startTime ? x.date + "T" + x.endTime : "", x.title, x.meetingPoint, [x.provider, x.bookingRef && "Buchung: " + x.bookingRef, x.persons && x.persons + " Personen", o.notes && x.notes].filter(Boolean).join("\n")); }
  if (o.parts.has("itinerary")) for (const i of of("itinerary")) if (inR(i.date)) { n++;
    const pl = db.places.find((p) => p.id === i.placeId);
    ev(i.id, i.date + (i.startTime ? "T" + i.startTime : ""), i.endTime && i.startTime ? i.date + "T" + i.endTime : "", i.title, pl ? [pl.name, pl.address].filter(Boolean).join(", ") : "", o.notes ? i.notes : ""); }
  out.push("END:VCALENDAR");
  // Zeilen über 75 Zeichen falten
  const folded = out.map((l) => { const parts = []; let rest = l; while (rest.length > 74) { parts.push(rest.slice(0, 74)); rest = " " + rest.slice(74); } parts.push(rest); return parts.join("\r\n"); });
  return { text: folded.join("\r\n") + "\r\n", count: n };
}

/* ---------- Dateien übergeben ---------- */
let dlNs;
async function offerFile(filename, data, note = repNote) {
  if (dlNs === undefined) { try { dlNs = (await window.claude?.use?.("downloads")) ?? null; } catch { dlNs = null; } }
  if (!dlNs) return webDownload(filename, data, note);
  try {
    const res = await dlNs.save({ filename, data });
    note(res.status === "delivered" ? `„${filename}“ wurde übergeben.` : `„${filename}“ wurde gespeichert. Auf dem iPad findest du sie in der Dateien-App.`);
  } catch (e) {
    note(e?.code === "declined" ? "Speichern abgebrochen." : e?.code === "rate_limited" ? "Es ist schon ein Speicherdialog offen. Bitte diesen erst schließen." : "Die Datei konnte nicht gespeichert werden.");
  }
}
function repNote(msg, html) { const el = document.getElementById("rep-note"); if (el) { if (html) el.innerHTML = html; else el.textContent = msg; } }
const fileBase = (t) => t.title.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/Ä/g, "Ae").replace(/Ö/g, "Oe").replace(/Ü/g, "Ue").replace(/ß/g, "ss").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") || "Reise";

async function doExport(fmt) {
  const t = trip(); const o = st.rep; const r = buildReport(t, o);
  const preset = PRESETS.find((p) => p.k === o.preset);
  const name = `${fileBase(t)}_${preset ? fileBase({ title: preset.l }) : "Auswahl"}`;
  if (fmt !== "ics" && !r.sections.length) return repNote("Bitte mindestens einen Baustein auswählen.");
  repNote("Wird erstellt …");
  try {
    if (fmt === "pdf") { webPrint(); return repNote("Im Druckdialog drucken oder über das Teilen-Symbol als PDF sichern."); }
    else if (fmt === "docx") await offerFile(name + ".docx", await makeDocx(r));
    else if (fmt === "xlsx") await offerFile(name + ".xlsx", await makeXlsxOwn(r));
    else if (fmt === "csv") {
      if (r.sections.length === 1) await offerFile(`${name}.csv`, csvOf(r.sections[0].data));
      else {
        await loadLib("jszip");
        const zip = new window.JSZip();
        for (const s of r.sections) { zip.file(`${fileBase({ title: s.title })}.csv`, csvOf(s.data)); if (s.data2) zip.file(`${fileBase({ title: s.data2.name })}.csv`, csvOf(s.data2)); }
        await offerFile(`${name}_CSV.zip`, await zip.generateAsync({ type: "arraybuffer" }));
      }
    } else if (fmt === "ics") {
      const c = makeIcs(t, o);
      if (!c.count) return repNote("Für die Kalenderdatei bitte Verkehr, Unterkünfte, Ausflüge oder Tagesplan auswählen (mit Terminen im Zeitraum).");
      await offerFile(`${fileBase(t)}_Termine.ics`, c.text);
    }
  } catch (e) {
    repNote(e?.message === "lib" ? "Ein Baustein für dieses Format konnte nicht geladen werden. Bitte Internetverbindung prüfen und erneut tippen." : "Beim Erstellen ist ein Fehler aufgetreten.");
  }
}

function copyText() {
  const text = reportText(buildReport(trip(), st.rep));
  const fallback = () => {
    repNote("", `Bitte den markierten Text kopieren:<textarea id="rep-copy" rows="8" readonly style="margin-top:6px">${esc(text)}</textarea>`);
    const ta = document.getElementById("rep-copy"); ta.focus(); ta.select();
  };
  try { navigator.clipboard.writeText(text).then(() => repNote("Der Text liegt in der Zwischenablage."), fallback); } catch { fallback(); }
}

      <span class="eyebrow">Vorlage</span>

      <span class="eyebrow" style="margin-top:6px">Bausteine</span>
      <div class="checks">${PARTS.map(([k, l]) => `<label for="rp-${k}"><input type="checkbox" id="rp-${k}" data-rep="part" value="${k}" ${o.parts.has(k) ? "checked" : ""}>${l}</label>`).join("")}</div>

      <div class="checks">

    </div>
    <span class="eyebrow">Vorschau</span>
    <div id="rep-preview">${reportHtml(buildReport(t, o))}</div>
  </div>`;
}
const refreshPreview = () => { const el = document.getElementById("rep-preview"); if (el) el.innerHTML = reportHtml(buildReport(trip(), st.rep)); document.querySelectorAll('[data-act="preset"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === st.rep.preset))); };

/* ---------- Ereignisse ---------- */
const reset = () => { st.editing = null; st.confirmDel = null; st.error = null; st.openDay = null; st.payId = null; st.leg = "OUT"; st.emEdit = false; dirty = false; clearDraft(); };

$app.addEventListener("click", (e) => {
  if (e.target.classList?.contains("pick-native")) { try { e.target.showPicker?.(); } catch {} return; }
  const b = e.target.closest("[data-act]"); if (!b || b.type === "checkbox") return;
  if (b.dataset.act === "exp") { if (b.dataset.id === "copy") copyText(); else doExport(b.dataset.id); return; }
  if (b.dataset.act === "pk-all" || b.dataset.act === "pk-none") {
    const on = b.dataset.act === "pk-all";
    $app.querySelectorAll("[data-pkitem], [data-pkcat]").forEach((c) => { if (!c.disabled) c.checked = on; });
    if (on) $app.querySelectorAll(".pk-cat").forEach((d) => { d.open = true; });
    pkCount(); return;
  }
  if (b.dataset.act === "pk-take-sel") {
    const sel = [...$app.querySelectorAll("[data-pkitem]:checked")];
    for (const c of sel) if (!of("packing").some((i) => i.name.toLowerCase() === c.value.toLowerCase())) db.packing.push({ id: uid(), tripId: st.tripId, name: c.value, category: c.dataset.cat, quantity: 1, packed: false });
    save(); st.pkOpen = false; render(); toast(`${sel.length} ${sel.length === 1 ? "Eintrag" : "Einträge"} übernommen`); return;
  }
  if (b.dataset.act === "copy") { const v = b.dataset.v; try { navigator.clipboard.writeText(v).then(() => toast(`„${v}“ kopiert`), () => toast("Kopieren ist hier nicht möglich")); } catch { toast("Kopieren ist hier nicht möglich"); } return; }
  if (b.dataset.act === "em-add-person") { emAddPerson(b.closest("form")); onDraft(); return; }
  if (b.dataset.act === "em-del-person") { b.closest("[data-person]").remove(); onDraft(); return; }
  if (b.dataset.act === "em-add-row") { emAddRow(b.closest("[data-person]"), b.dataset.id); onDraft(); return; }
  if (b.dataset.act === "em-del-row") { b.closest("[data-row]").remove(); onDraft(); return; }
  if (b.dataset.act === "backup-save") { const d = new Date().toLocaleDateString("sv-SE"); offerFile(`Reiseplaner_Sicherung_${d}.json`, JSON.stringify(backupData(), null, 1), (m) => { const el = document.getElementById("bk-note"); if (el) el.textContent = m; }); return; }
  if (b.dataset.act === "sugg") {
    const box = b.closest(".sugg"), el = document.getElementById(box.dataset.for);
    el.value = b.dataset.v; closeSugg(); onDraft();
    const order = [...el.closest("form").querySelectorAll("input:not(.pick-native), select, textarea")];
    order[order.indexOf(el) + 1]?.focus();
    return;
  }
  if (b.dataset.act === "seg-add") { addSeg(b.closest("[data-leg]")); onDraft(); return; }
  if (b.dataset.act === "seg-del") { const legEl = b.closest("[data-leg]"); b.closest("[data-seg]").remove(); renumberSegs(legEl); onDraft(); return; }
  if (b.dataset.act === "stay-add") { addStay(b.closest("form")); onDraft(); return; }
  if (b.dataset.act === "stay-del") { const f = b.closest("form"); b.closest("[data-stay]").remove(); renumberStays(f); onDraft(); return; }
  if (b.dataset.act === "leg") {
    st.leg = b.dataset.id;
    const form = b.closest("form");
    form.querySelectorAll('[role="tab"]').forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    form.querySelectorAll("[data-leg]").forEach((x) => { x.hidden = x.dataset.leg !== st.leg; });
    return;
  }
  const { act, id, kind } = b.dataset;
  switch (act) {
    case "open": st.tripId = id; st.tab = "overview"; reset(); break;
    case "home": st.tripId = null; st.emGlobal = false; reset(); break;
    case "tab": st.tab = id; reset(); if (id === "export") st.rep = repDefaults(trip()); break;
    case "preset": st.rep = repDefaults(trip(), id); break;
    case "new-trip": st.tripForm = "new"; reset(); break;
    case "edit-trip": st.tripForm = "edit"; reset(); break;
    case "cancel-trip": st.tripForm = null; reset(); break;
    case "add": reset(); st.editing = "new"; break;
    case "add-park": reset(); st.editing = "new-park"; break;
    case "em-edit": reset(); st.emEdit = true; break;
    case "em-cancel": reset(); break;
    case "em-open": reset(); st.emGlobal = true; break;
    case "em-close": reset(); st.emGlobal = false; break;
    case "pack-take": { const v = document.getElementById("pk-src")?.value; if (!v) { toast("Bitte erst eine Vorlage oder Reise wählen"); return; } const n = packTakeover(v); save(); toast(n ? `${n} ${n === 1 ? "Eintrag" : "Einträge"} übernommen` : "Alles davon steht schon auf der Liste"); break; }
    case "unpack": st.confirmDel = "unpack"; break;
    case "unpack-yes": of("packing").forEach((i) => { i.packed = false; }); save(); st.confirmDel = null; break;
    case "edit": reset(); st.editing = id; break;
    case "cancel": reset(); break;
    case "draft-discard": reset(); break;
    case "add-day": reset(); st.openDay = id; break;
    case "del": st.confirmDel = id; break;
    case "del-no": st.confirmDel = null; break;
    case "del-yes": { const ids = kind === "transports" ? new Set(journeyOf(id).map((l) => l.id)) : new Set([id]); db[kind] = db[kind].filter((x) => !ids.has(x.id)); } if (kind === "places") db.itinerary.forEach((i) => { if (i.placeId === id) i.placeId = ""; }); save(); st.confirmDel = null; break;
    case "del-trip": st.confirmDel = "trip"; break;
    case "del-trip-yes": for (const k of ["transports", "accommodations", "places", "itinerary", "packing", "expenses"]) db[k] = db[k].filter((x) => x.tripId !== st.tripId); db.trips = db.trips.filter((t) => t.id !== st.tripId); save(); st.tripId = null; st.tripForm = null; reset(); break;
    case "sample": addSample(); save(); break;
    case "migrate-yes": { const m = migration(); if (m) { for (const t of m.fresh) { db.trips.push(t); for (const k of COLLS) db[k].push(...(m.d[k] || []).filter((x) => x.tripId === t.id)); } save(); } markMigrated(); break; }
    case "migrate-no": markMigrated(); break;
    case "budget-toggle": st.budgetOpen = !st.budgetOpen; st.error = null; break;
    case "pay": reset(); st.payId = id; break;
    case "pay-cancel": st.payId = null; st.error = null; break;
    case "add-trip-day": trip().endDate = addDays(trip().endDate, 1); save(); reset(); break;
    default: return;
  }
  render();
});

$app.addEventListener("change", (e) => {
  const b = e.target;
  if (b.classList.contains("pick-native")) {
    const txt = document.getElementById(b.dataset.target);
    txt.value = b.type === "date" ? isoToDe(b.value) : b.value;
    checkField(txt);
    if (txt.id === "rp-from" || txt.id === "rp-to") repDate(txt);
    return;
  }
  if (b.id === "rp-from" || b.id === "rp-to") { repDate(b); return; }
  if (b.dataset.rep) {
    const k = b.dataset.rep;
    if (k === "part") b.checked ? st.rep.parts.add(b.value) : st.rep.parts.delete(b.value);
    else st.rep[k] = b.checked;
    st.rep.preset = "";
    refreshPreview();
    return;
  }
  if (b.id === "p-pick") {
    if (!b.value) return;
    const [cat, name] = b.value.split("|");
    document.getElementById("p-name").value = name;
    document.getElementById("p-cat").value = cat;
    document.getElementById("p-qty").focus();
    return;
  }
  if (b.type !== "checkbox") return;
  const coll = b.dataset.act === "pack" ? "packing" : b.dataset.act === "visit" ? "places" : null; if (!coll) return;
  const x = db[coll].find((i) => i.id === b.dataset.id); x[coll === "packing" ? "packed" : "visited"] = b.checked; save(); render();
});

$app.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target; const kind = f.dataset.form; const o = Object.fromEntries(new FormData(f).entries());
  for (const k in o) o[k] = String(o[k]).trim();
  for (const k of Object.keys(o)) if (k.endsWith("__d")) {
    const n = k.slice(0, -3), def = FIELDS[kind]?.find((x) => x.n === n) || { l: n };
    const ref = trip() ? +trip().startDate.slice(0, 4) : new Date().getFullYear();
    const d = parseDateDE(o[k], ref), tt = parseTimeDE(o[n + "__t"]);
    if (d === null) return fail(f, `${def.l}: Datum nicht erkannt. Bitte so eingeben: 15.04.2027 oder 15.4.`);
    if (tt === null) return fail(f, `${def.l}: Uhrzeit nicht erkannt. Bitte so eingeben: 14:00 oder 14.`);
    if (!d && def.req) return fail(f, `${def.l}: Datum fehlt.`);
    o[n] = d ? d + (tt ? "T" + tt : "") : "";
    delete o[k]; delete o[n + "__t"];
  }
  const err = validate(kind, o); if (err) return fail(f, err);
  const today = new Date().toLocaleDateString("sv-SE");
  if (kind === "expense") {
    const amt = num(o.amount);
    if (!(amt > 0)) { st.error = "Bitte einen Betrag größer 0 eingeben, z. B. 12,50."; render(); return; }
    db.expenses.push({ id: uid(), tripId: st.tripId, date: o.date || today, title: o.title || o.category || "Ausgabe", category: o.category || "Sonstiges", amount: String(amt), currency: o.currency || "EUR", status: o.planned ? "PLANNED" : "PAID", paymentMethod: o.paymentMethod || "CARD", notes: "" });
    save(); reset(); render(); document.getElementById("e-amt")?.focus(); return;
  }
  if (kind === "pay") {
    const amt = num(o.amount);
    if (!(amt > 0)) { st.error = "Bitte den bezahlten Betrag eingeben."; render(); return; }
    const e = ledger(trip()).find((x) => x.id === f.dataset.id);
    if (e?.virtual) db.expenses.push({ id: uid(), tripId: st.tripId, date: today, title: e.title, category: e.category, amount: String(amt), currency: e.currency, status: "PAID", paymentMethod: o.paymentMethod, sourceType: e.sourceType, sourceId: e.sourceId, notes: "" });
    else if (e) Object.assign(db.expenses.find((x) => x.id === e.id), { amount: String(amt), status: "PAID", paymentMethod: o.paymentMethod });
    save(); reset(); render(); return;
  }
  if (kind === "budget") {
    const t = trip(); const fc = (o.foreignCurrency || "").toUpperCase();
    if (fc && !/^[A-Z]{3}$/.test(fc)) { st.error = "Währung bitte als dreistelliges Kürzel eingeben, z. B. CHF."; render(); return; }
    if (fc && fc !== "EUR" && !(num(o.fxRate) > 0)) { st.error = `Bitte den Kurs angeben: 1 EUR = wie viel ${fc}?`; render(); return; }
    const cb = {};
    for (const [k, v] of Object.entries(o)) if (k.startsWith("cb:") && num(v) > 0) cb[k.slice(3)] = num(v);
    Object.assign(t, { budgetTotal: num(o.budgetTotal) || "", foreignCurrency: fc === "EUR" ? "" : fc, fxRate: fc && fc !== "EUR" ? num(o.fxRate) : "", categoryBudgets: cb });
    st.budgetOpen = false; save(); reset(); render(); return;
  }
  if (kind === "days") {
    const t = trip(); const n = parseInt(o.days, 10);
    const lastUsed = of("itinerary").reduce((m, x) => (x.date > m ? x.date : m), "");
    const minDays = lastUsed ? days(t.startDate, lastUsed).length : 1;
    if (!(n >= 1 && n <= 366)) { st.error = "Bitte eine Tageszahl zwischen 1 und 366 eingeben."; render(); return; }
    if (n < minDays) { st.error = `Für Tag ${minDays} ist noch etwas geplant. Bitte erst diese Einträge löschen oder mindestens ${minDays} Tage wählen.`; render(); return; }
    t.endDate = addDays(t.startDate, n - 1); save(); reset(); render(); return;
  }
  if (kind === "trip") {
    if (st.tripForm === "new") { const t = { id: uid(), ...o }; db.trips.push(t); st.tripId = t.id; st.tab = "overview"; }
    else Object.assign(trip(), o);
    st.tripForm = null;
  } else if (kind === "emergency") {
    const r = readEmergency(f);
    if (r.error) return fail(f, r.error);
    profile = { persons: r.persons };
    if (trip()) trip().emergency = r.trip;
    saveProfile();
  } else if (kind === "itinerary") {
    const s1 = parseTimeDE(o.startTime), s2 = parseTimeDE(o.endTime);
    if (s1 === null || s2 === null) return fail(f, "Uhrzeit nicht erkannt. Bitte so eingeben: 9:30 oder 930.");
    if (s1 && s2 && s2 < s1) return fail(f, "„Bis“ liegt vor „Von“.");
    db.itinerary.push({ id: uid(), tripId: st.tripId, date: f.dataset.day, title: o.title, placeId: o.placeId, notes: o.notes, startTime: s1, endTime: s2 });
  } else if (kind === "packing") {
    if (of("packing").some((i) => i.name.toLowerCase() === o.name.toLowerCase())) { st.error = `„${o.name}“ steht schon auf der Liste.`; render(); return; }
    if (o.category === "__neu" && !o.categoryNew) return fail(f, "Bitte einen Namen für die neue Kategorie eingeben.");
    db.packing.push({ id: uid(), tripId: st.tripId, name: o.name, category: (o.category === "__neu" ? o.categoryNew : o.category) || "Sonstiges", quantity: Math.max(1, parseInt(o.quantity, 10) || 1), packed: false });
  } else if (kind === "accommodations") {
    const err2 = saveStays(f);
    if (err2) return fail(f, err2);
  } else if (kind === "parking") {
    const err2 = saveParking(f);
    if (err2) return fail(f, err2);
  } else if (kind === "excursions") {
    const err2 = saveExcursion(f);
    if (err2) return fail(f, err2);
  } else if (kind === "transports") {
    const err2 = saveJourney(f);
    if (err2) { const el = f.querySelector("[data-err]"); el.textContent = err2; el.hidden = false; return; } // Eingaben bleiben stehen
  } else if (st.editing === "new") {
    db[kind].push({ id: uid(), tripId: st.tripId, ...(kind === "places" ? { visited: false } : {}), ...o });
  } else {
    Object.assign(db[kind].find((x) => x.id === st.editing), o);
  }
  save(); reset(); render();
  if (kind === "packing") document.getElementById("p-name")?.focus();
});

function repDate(el) {
  const v = parseDateDE(el.value, +trip().startDate.slice(0, 4));
  if (v === null) return;
  st.rep[el.id === "rp-from" ? "from" : "to"] = v;
  st.rep.preset = "";
  refreshPreview();
}

/** Datum/Uhrzeit sofort prüfen: ungültig = rote Meldung (Speichern wird abgelehnt),
    außerhalb der Reise = gelbe Rückfrage, ob das Datum stimmt. */
function checkField(x) {
  const isDate = x.dataset.kind === "date";
  const t = trip();
  const v = isDate ? parseDateDE(x.value, t ? +t.startDate.slice(0, 4) : new Date().getFullYear()) : parseTimeDE(x.value);
  const lab = x.closest("label");
  let m = lab.querySelector(".fieldmsg");
  if (!m) { m = document.createElement("span"); m.className = "fieldmsg"; m.setAttribute("aria-live", "polite"); lab.appendChild(m); }
  x.classList.toggle("bad", v === null);
  x.classList.remove("check");
  m.className = "fieldmsg"; m.textContent = "";
  if (v === null) {
    m.className = "fieldmsg bad";
    m.textContent = isDate ? `„${x.value}“ ist kein gültiges Datum. Bitte prüfen, z. B. 02.09.2027.` : `„${x.value}“ ist keine gültige Uhrzeit. Bitte prüfen, z. B. 9:30.`;
    return;
  }
  if (!v) return;
  x.value = isDate ? isoToDe(v) : v;
  const nat = x.parentElement.querySelector(".pick-native");
  if (nat) nat.value = v;
  if (isDate && /birth$/.test(x.id) && v > new Date().toLocaleDateString("sv-SE")) { const b = String(+v.slice(0, 4) - 100) + v.slice(4); x.value = isoToDe(b); return; }
  if (isDate && t && !x.id.startsWith("rp-") && !x.id.startsWith("em-") && (v < addDays(t.startDate, -1) || v > addDays(t.endDate, 1))) {
    x.classList.add("check");
    m.className = "fieldmsg warn";
    m.textContent = `${fDate(v)} liegt außerhalb der Reise (${isoToDe(t.startDate)} – ${isoToDe(t.endDate)}). Stimmt das Datum?`;
  }
}

$app.addEventListener("input", (e) => { if (e.target.tagName === "INPUT" && suggKind(e.target)) showSugg(e.target); else closeSugg(); });
$app.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSugg(); });
$app.addEventListener("change", (e) => { if (e.target.id === "p-cat") { const n = document.getElementById("p-catnew"); n.hidden = e.target.value !== "__neu"; if (!n.hidden) n.focus(); } });
function pkCount() {
  const n = $app.querySelectorAll("[data-pkitem]:checked").length;
  const c = document.getElementById("pk-count"), btn = document.getElementById("pk-take");
  if (c) c.textContent = `${n} ausgewählt`;
  if (btn) { btn.disabled = !n; btn.textContent = n ? `${n} ausgewählte übernehmen` : "Ausgewählte übernehmen"; }
  $app.querySelectorAll("[data-pkcat]").forEach((cb) => {
    const its = [...$app.querySelectorAll(`[data-pkitem][data-cat="${CSS.escape(cb.dataset.pkcat)}"]`)];
    const k = its.filter((i) => i.checked).length;
    cb.checked = its.length > 0 && k === its.length; cb.indeterminate = k > 0 && k < its.length;
  });
}
$app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset?.pkcat !== undefined) { $app.querySelectorAll(`[data-pkitem][data-cat="${CSS.escape(t.dataset.pkcat)}"]`).forEach((i) => { i.checked = t.checked; }); t.closest("details").open = true; pkCount(); }
  else if (t.dataset?.pkitem !== undefined) pkCount();
});
$app.addEventListener("toggle", (e) => { if (e.target.classList?.contains("pk-pick")) st.pkOpen = e.target.open; }, true);
$app.addEventListener("change", (e) => { if (/^[or]\d+_type$/.test(e.target.name || "")) applyType(e.target.closest("[data-seg]")); });
$app.addEventListener("change", (e) => {
  if (e.target.name === "mapapp") { mapApp = e.target.value; try { localStorage.setItem(KEY + ".karten", mapApp); } catch {} toast(mapApp === "google" ? "Adressen öffnen jetzt in Google Maps" : "Adressen öffnen jetzt in Apple Karten"); return; }
  if (e.target.id !== "bk-file" || !e.target.files?.[0]) return;
  const fr = new FileReader();
  fr.onload = () => { const msg = importBackup(String(fr.result)); render(); const el = document.getElementById("bk-note"); if (el) el.textContent = msg; };
  fr.onerror = () => { const el = document.getElementById("bk-note"); if (el) el.textContent = "Die Datei konnte nicht gelesen werden."; };
  fr.readAsText(e.target.files[0]);
});
function updateConv() {
  const el = document.getElementById("e-conv"), t = trip();
  if (!el || !t) return;
  const amt = num(document.getElementById("e-amt").value), cur = document.getElementById("e-cur").value, r = num(t.fxRate);
  el.textContent = !amt || !t.foreignCurrency || !(r > 0) ? "" : cur === "EUR" ? `≈ ${Math.round(amt * r).toLocaleString("de-DE")} ${t.foreignCurrency}` : `≈ ${fMoney(amt / r)}`;
}
for (const evName of ["input", "change"]) $app.addEventListener(evName, (e) => { if (e.target.id === "e-amt" || e.target.id === "e-cur") updateConv(); });
for (const evName of ["input", "change"]) $app.addEventListener(evName, (e) => {
  const f = e.target.closest?.("form[data-form]");
  if (f && f.dataset.form !== "days") onDraft();
});

$app.addEventListener("focusout", (e) => {
  if (e.target.id && document.getElementById("sugg")?.dataset.for === e.target.id) setTimeout(closeSugg, 150);
  if (/^[or]\d+_number$/.test(e.target.name || "")) { fillCarrierFromNumber(e.target); onDraft(); }
  if (e.target.classList?.contains("dt-text")) checkField(e.target);
});

boot();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
try { navigator.storage?.persist?.(); } catch {}
})();
</script>

</body>
