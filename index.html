<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reiseplaner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reiseplaner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f5c52">
<meta name="reiseplaner-version" content="web-v1">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
@media print {
  body.print-report * { visibility: hidden; }
  body.print-report #rep-preview, body.print-report #rep-preview * { visibility: visible; }
  body.print-report #rep-preview { position: absolute; left: 0; top: 0; width: 100%; }
  body.print-report .paper { box-shadow: none; border: 0; padding: 0; max-width: none; background: #fff; color: #000; }
  body.print-report .rep-sec + .rep-sec { break-before: page; border-top: 0; margin-top: 0; padding-top: 0; }
  body.print-report tr { break-inside: avoid; }
  .topbar, .tabs, .hero { display: none !important; }
}
</style>
</head>
<body>
<style>
/* Layout: eine Spalte, Reisekopf als farbiges Band, Tabs darunter, Karten im Stil von Reiseunterlagen */
:root {
  --bg: #f2f4f3; --surface: #ffffff; --sunk: #e6eae8; --line: #d3dad7;
  --fg: #16201d; --muted: #5d6b66; --accent: #0f5c52; --accent-fg: #ffffff;
  --signal: #c9850d; --danger: #b3261e; --ok: #2f7d4a; --paper: #ffffff; --paper-fg: #16201d; --warn: #8a5a00; --em: #b3261e; --em-soft: #fbeceb;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --surface: #19221f; --sunk: #222d29; --line: #2f3c37;
  --fg: #e7eeeb; --muted: #95a59f; --accent: #4fb8a8; --accent-fg: #0b1513;
  --signal: #e8a93a; --danger: #f08a80; --ok: #6cc28a; --paper: #1c2623; --paper-fg: #e7eeeb; --warn: #e8a93a; --em: #e5484d; --em-soft: #3a1d1d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111816; --surface: #19221f; --sunk: #222d29; --line: #2f3c37;
  --fg: #e7eeeb; --muted: #95a59f; --accent: #4fb8a8; --accent-fg: #0b1513;
  --signal: #e8a93a; --danger: #f08a80; --ok: #6cc28a; --paper: #1c2623; --paper-fg: #e7eeeb; --warn: #e8a93a; --em: #e5484d; --em-soft: #3a1d1d; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 20px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; line-height: 1.15; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
.mono { font-family: var(--mono); font-size: .85em; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
button, .btn { font: inherit; font-weight: 600; font-size: .9rem; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); }
button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
button.link { background: transparent; color: var(--muted); padding: 6px 8px; font-weight: 500; }
button.link:hover { color: var(--fg); }
button.danger { background: var(--danger); color: var(--surface); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
input, select, textarea { font: inherit; width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 500; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.full { grid-column: 1 / -1; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.brand { font-family: var(--display); font-size: 1.25rem; color: var(--accent); }
.sync { font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.sync.warn { color: var(--danger); border-color: var(--danger); }
.banner { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
label.ghost-btn { background: transparent; color: var(--fg); border: 1px solid var(--line); display: inline-block; cursor: pointer; }
button.chipbtn { background: var(--surface); color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
button.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 14px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: .9rem; cursor: pointer; }
.exports { display: flex; flex-wrap: wrap; gap: 8px; }
.paper { background: var(--paper); color: var(--paper-fg); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 22px rgba(0, 0, 0, .08); padding: clamp(18px, 5vw, 48px); max-width: 794px; margin: 0 auto; font-size: 14px; }
.paper .pagehead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .75rem; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 18px; }
.paper h2 { font-size: 1.6rem; }
.paper .rep-sec { display: flex; flex-direction: column; gap: 10px; }
.paper .rep-sec + .rep-sec { border-top: 1px dashed var(--line); margin-top: 26px; padding-top: 22px; }
.paper .rep-sec h3 { font-size: 1.25rem; color: var(--accent); }
.paper h4 { margin: 8px 0 0; font-size: .95rem; }
.paper p { margin: 0; }
.paper p.just { text-align: justify; hyphens: auto; }
.paper .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; }
.paper .kv b { font-weight: 600; }
.tablewrap { overflow-x: auto; }
.paper table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.paper th, .paper td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: pre-line; }
.paper th { background: var(--sunk); font-weight: 600; }
.paper .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.paper .box { display: inline-block; width: 12px; height: 12px; border: 1.5px solid currentColor; border-radius: 2px; margin-right: 8px; vertical-align: -1px; text-align: center; font-size: 10px; line-height: 10px; }
.paper ul.cl { list-style: none; margin: 0; padding: 0; columns: 2 220px; }
.paper ul.cl li { padding: 2px 0; break-inside: avoid; }

/* Reiseübersicht */
.trips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.trip-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; color: var(--fg); padding: 0; font-weight: 400; }
.trip-card .band { height: 8px; }
.trip-card .in { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.count { font-size: .78rem; color: var(--muted); }
.days-left { color: var(--signal); font-weight: 600; font-size: .82rem; }

/* Reisekopf */
.hero { border-radius: 14px; color: #fff; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.hero .back { color: rgba(255,255,255,.85); background: transparent; padding: 0; font-weight: 500; text-align: left; }
.hero h1 { color: #fff; }
.hero .sub { opacity: .9; }
.hero button.ghost { color: #fff; border-color: rgba(255,255,255,.45); }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 16px 0 18px; }
.tabs button { background: transparent; color: var(--muted); border-radius: 0; border-bottom: 2px solid transparent; padding: 10px 12px; white-space: nowrap; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.5rem; font-variant-numeric: tabular-nums; }

/* Fahrkarten-Optik für Verkehrsmittel */
.ticket { display: grid; grid-template-columns: 1fr auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ticket .main { padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ticket .stub { border-left: 2px dashed var(--line); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; gap: 8px; background: var(--sunk); min-width: 110px; }
.route { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 10px; align-items: end; }
.route .t { font-family: var(--mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.route .p { font-weight: 600; overflow-wrap: anywhere; }
.route .arrow { color: var(--signal); padding-bottom: 4px; }
.route .to { text-align: right; }
.chip { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--accent); }
@media (max-width: 520px) { .ticket { grid-template-columns: 1fr; } .ticket .stub { border-left: 0; border-top: 2px dashed var(--line); flex-direction: row; align-items: center; } }

.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.item .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.actions { display: flex; gap: 2px; flex-shrink: 0; }
.meta { font-size: .8rem; color: var(--muted); }
.done { text-decoration: line-through; color: var(--muted); }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; margin: 2px 0 0; }

.day h3 { margin-bottom: 8px; }
.slot { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--sunk); align-items: start; }
.slot .time { font-family: var(--mono); font-size: .85rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.timeline li { display: grid; grid-template-columns: 52px 22px 1fr; gap: 6px; padding: 5px 0; }
.timeline ol { list-style: none; margin: 0; padding: 0; }
.timeline .time { font-family: var(--mono); font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.progress { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.pk-pick > summary, .pk-cat > summary { cursor: pointer; list-style-position: outside; }
.pk-cat { border-top: 1px solid var(--line); padding: 8px 0; }
.pk-cat > summary { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.pk-cat > summary label { display: inline-flex; gap: 8px; align-items: center; }
.pk-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; padding: 8px 0 4px 28px; }
.pk-items label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.pk-has { color: var(--muted); }
.pack li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pack li:last-child { border-bottom: 0; }
.pack ul { list-style: none; margin: 0; padding: 0; }
.pack label { display: flex; gap: 10px; align-items: center; flex: 1; cursor: pointer; }
.err { color: var(--danger); font-size: .85rem; }
/* Datum/Uhrzeit: freie Eingabe plus Kalender bzw. Uhr zum Antippen */
.dt { display: flex; gap: 6px; align-items: stretch; }
.dt .dt-text { flex: 1; min-width: 0; }
.dt-text.bad { border-color: var(--danger); }
.dt-text.check { border-color: var(--warn); }
.fieldmsg { font-size: .78rem; font-weight: 500; }
.fieldmsg.bad { color: var(--danger); }
.fieldmsg.warn { color: var(--warn); }
.pick { position: relative; width: 46px; flex-shrink: 0; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); font-size: 1.15rem; overflow: hidden; }
.pick-native { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: 0; }
.journey { display: flex; flex-direction: column; gap: 6px; }
.layover { font-size: .82rem; color: var(--muted); padding: 2px 0 2px 14px; border-left: 2px dashed var(--line); margin-left: 18px; }
label.f { position: relative; }
label.f i, .em-l i, dt i { font-style: normal; color: var(--muted); font-weight: 400; }
a.maplink { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
a.maplink:hover { text-decoration: underline; }
button.code { font-family: var(--mono); font-size: .85rem; font-weight: 500; background: var(--sunk); color: var(--fg); border: 1px dashed var(--line); padding: 3px 8px; border-radius: 6px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.glance-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.glance-row:last-child { border-bottom: 0; }
.g-ico { font-size: 1.1rem; }
.g-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.g-codes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.g-code { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
@media (max-width: 560px) { .glance-row { grid-template-columns: 28px minmax(0, 1fr); } .g-codes { grid-column: 2; justify-content: flex-start; } .g-code { align-items: flex-start; } }
.hometime { display: block; font-size: .72rem; color: var(--muted); font-family: var(--body); }
.tabs button.em-tab { color: var(--em); font-weight: 700; letter-spacing: .04em; }
.tabs button.em-tab[aria-selected="true"] { border-bottom-color: var(--em); color: var(--em); }
.em-head { background: var(--em); color: #fff; border-radius: 14px; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.em-head h2 { color: #fff; font-family: var(--body); font-weight: 800; letter-spacing: .08em; font-size: 1.5rem; }
.em-head span { opacity: .9; font-size: .9rem; }
button.em-btn { background: #fff; color: #b3261e; }
.em-card { border-left: 4px solid var(--em); display: flex; flex-direction: column; gap: 10px; }
.em-name { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; font-size: 1.15rem; }
.em-blood { display: inline-flex; flex-direction: column; background: var(--em); color: #fff; border-radius: 8px; padding: 4px 12px; font-weight: 800; font-size: 1.3rem; line-height: 1.2; }
.em-blood i { font-style: normal; font-size: .62rem; font-weight: 600; letter-spacing: .04em; opacity: .9; }
.em-alert { background: var(--em-soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.em-alert b { color: var(--em); font-size: 1.05rem; }
.em-alert i, .em-blood i { font-style: normal; }
.em-alert i { color: var(--muted); }
.em-card dl { display: grid; grid-template-columns: minmax(150px, max-content) minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.em-card dt { font-size: .82rem; font-weight: 600; color: var(--fg); }
.em-card dd { margin: 0; }
.em-card ul { margin: 0; padding-left: 18px; }
@media (max-width: 560px) { .em-card dl { grid-template-columns: 1fr; gap: 2px; } .em-card dd { margin-bottom: 8px; } }
.em-due { color: var(--em); font-weight: 600; }
.em-row { border-top: 1px dashed var(--line); padding-top: 8px; }
button.em-start { background: var(--em); color: #fff; letter-spacing: .06em; font-weight: 800; }
.sugg { position: absolute; top: 100%; left: 0; right: 0; z-index: 30; margin-top: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .14); max-height: 320px; overflow-y: auto; }
.sugg button { display: block; width: 100%; text-align: left; background: transparent; color: var(--fg); font-weight: 400; border-radius: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sugg button:last-child { border-bottom: 0; }
.sugg button:hover, .sugg button:focus-visible { background: var(--sunk); }
.seg { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); }
.slot.auto { background: transparent; border: 1px dashed var(--line); }
.slot.auto button.link { padding: 2px 4px; font-size: .8rem; white-space: nowrap; }
.chip.leg { background: var(--accent); color: var(--accent-fg); }
.tabs.inner { margin: 0 0 4px; }
.hint { font-size: .8rem; color: var(--muted); }
.confirm { display: flex; gap: 6px; align-items: center; font-size: .82rem; }
/* Ausgaben */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.kpis b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .paid { background: var(--accent); }
.bar .plan { background: repeating-linear-gradient(45deg, var(--accent) 0 3px, transparent 3px 7px); opacity: .6; }
.bar.over .paid { background: var(--danger); }
.lamp { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; }
.lamp::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.lamp.green { color: var(--ok); } .lamp.yellow { color: var(--signal); } .lamp.red { color: var(--danger); }
.money { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.catrow:last-child, .exp:last-child { border-bottom: 0; }
.catrow .bar { grid-column: 1 / -1; }
.exp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.exp .full { grid-column: 1 / -1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="topbar">
    <span class="brand">Reiseplaner</span>
    <span class="sync" id="sync" aria-live="polite">Wird geladen …</span>
  </div>
  <div id="app"></div>
</div>

const COLLS = ["transports", "parking", "accommodations", "places", "excursions", "itinerary", "packing", "expenses"];

function bundle(id) {
  const trip = db.trips.find((t) => t.id === id);
  if (!trip) return null;
  const b = { trip };
  for (const k of COLLS) b[k] = db[k].filter((x) => x.tripId === id);
  return b;
}
function fromBundles(list) {
  const d = emptyDb();
  for (const b of list) {

    for (const k of COLLS) d[k].push(...(Array.isArray(b[k]) ? b[k] : []));

  el.textContent = text;
  el.classList.toggle("warn", warn);
  el.title = syncState === "error" ? syncMsg : "";
}
function enqueue(id, fn) {
  pending.set(id, (pending.get(id) || 0) + 1);

  Medikamente: ["Reiseapotheke", "Pflaster", "Schmerztabletten", "Persönliche Medikamente", "Mückenschutz"],
  Elektronik: ["Handy", "Ladekabel", "Powerbank", "Reiseadapter", "Kopfhörer", "Kamera", "E-Reader"],
  Sonstiges: ["Sonnenbrille", "Lesebrille", "Regenschirm", "Reiseführer", "Trinkflasche", "Tagesrucksack", "Haustürschlüssel", "Snacks für unterwegs"],
};
const TYPES = { FLIGHT: "Flug", TRAIN: "Zug", BUS: "Bus", CAR: "Auto", FERRY: "Fähre", PARKING: "Parken", OTHER: "Sonstiges" };
/* ---------- Ausgaben: Rechenlogik (entspricht src/lib/services/budget.ts) ---------- */
const EXP_CATS = ["Anreise & Verkehr", "Unterkunft", "Essen & Trinken", "Eintritte & Aktivitäten", "Einkäufe", "Sonstiges"];
/** Betrag aus Eingabe lesen: akzeptiert 1.500, 1500,50, 58.40, 1 500 € */
const num = (v) => {
  if (typeof v === "number") return Number.isFinite(v) ? v : 0;
  let x = String(v ?? "").trim().replace(/[\s€]/g, "");
  if (x.includes(",")) x = x.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g, "");
  const n = parseFloat(x);
  return Number.isFinite(n) ? n : 0;
};
const fNum = (v) => num(v).toLocaleString("de-DE", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fEur0 = (v) => num(v).toLocaleString("de-DE", { style: "currency", currency: "EUR", minimumFractionDigits: 0, maximumFractionDigits: 0 });
const toEur = (e, t) => (e.currency && e.currency !== "EUR" && num(t.fxRate) > 0 ? num(e.amount) / num(t.fxRate) : num(e.amount));
const sumEur = (list) => list.reduce((s, e) => s + e.eur, 0);

/** Alle Ausgaben einer Reise: erfasste plus automatisch übernommene Preise aus Unterkünften und Verkehr. */
function ledger(t) {
  const real = db.expenses.filter((e) => e.tripId === t.id);
  const linked = new Set(real.filter((e) => e.sourceId).map((e) => e.sourceId));
  const virt = [];
  for (const a of db.accommodations) if (a.tripId === t.id && num(a.price) > 0 && !linked.has(a.id))
    virt.push({ id: "src-" + a.id, virtual: true, sourceType: "accommodations", sourceId: a.id, title: a.name, category: "Unterkunft", amount: a.price, currency: "EUR", status: "PLANNED", date: a.checkIn.slice(0, 10) });
  for (const x of db.transports) if (x.tripId === t.id && num(x.price) > 0 && !linked.has(x.id))
    virt.push({ id: "src-" + x.id, virtual: true, sourceType: "transports", sourceId: x.id, title: x.type === "PARKING" ? `Parken: ${x.fromLocation}` : `${TYPES[x.type]} ${x.fromLocation} → ${x.toLocation}`, category: "Anreise & Verkehr", amount: x.price, currency: "EUR", status: "PLANNED", date: x.departAt.slice(0, 10) });
  for (const x of db.parking) if (x.tripId === t.id && num(x.price) > 0 && !linked.has(x.id))
    virt.push({ id: "src-" + x.id, virtual: true, sourceType: "parking", sourceId: x.id, title: `Parken: ${x.name}`, category: "Anreise & Verkehr", amount: x.price, currency: "EUR", status: "PLANNED", date: x.startAt.slice(0, 10) });
  for (const x of db.excursions) if (x.tripId === t.id && num(x.price) > 0 && !linked.has(x.id))
    virt.push({ id: "src-" + x.id, virtual: true, sourceType: "excursions", sourceId: x.id, title: x.title, category: "Eintritte & Aktivitäten", amount: x.price, currency: "EUR", status: "PLANNED", date: x.date });
  return [...real, ...virt].map((e) => ({ ...e, eur: toEur(e, t) })).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
}

function budgetSummary(t) {
  const items = ledger(t);
  const cb = t.categoryBudgets || {};
  const names = [...new Set([...EXP_CATS, ...Object.keys(cb), ...items.map((e) => e.category)])];
  const cats = names.map((name) => {
    const l = items.filter((e) => e.category === name);
    return { name, budget: num(cb[name]), paid: sumEur(l.filter((e) => e.status === "PAID")), planned: sumEur(l.filter((e) => e.status === "PLANNED")) };
  });
  const catSum = Object.values(cb).reduce((a, v) => a + num(v), 0);
  const total = num(t.budgetTotal);
  return { items, cats, budget: total || catSum, budgetFromCats: !total && catSum > 0, catSum, total, paid: sumEur(items.filter((e) => e.status === "PAID")), planned: sumEur(items.filter((e) => e.status === "PLANNED")) };
}

/** Ampel, gemessen an bezahlt + noch zu bezahlen: unter 80 % grün, ab 80 % gelb (bei genau 100 % „ausgeschöpft“), rot erst beim Überschreiten. */
const ampel = (used, budget) => (!budget ? "" : used > budget + 0.005 ? "red" : used >= budget * 0.8 ? "yellow" : "green");
const lampText = (a, used, budget) => (a === "red" ? "überschritten" : a === "yellow" ? (used >= budget - 0.005 ? "ausgeschöpft" : "fast ausgeschöpft") : "im Rahmen");
const lamp = (used, budget, short) => { const a = ampel(used, budget); if (!a) return ""; const tx = lampText(a, used, budget); return `<span class="lamp ${a}" title="${tx}">${short ? "" : tx}</span>`; };
function bar(paid, planned, budget) {
  const scale = Math.max(budget, paid + planned) || 1;
  return `<div class="bar ${budget && paid + planned > budget ? "over" : ""}" role="img" aria-label="bezahlt ${fMoney(paid)}, noch zu bezahlen ${fMoney(planned)}${budget ? ", Budget " + fMoney(budget) : ""}"><i class="paid" style="width:${(paid / scale) * 100}%"></i><i class="plan" style="width:${(planned / scale) * 100}%"></i></div>`;
}
/* ---------- Datum und Uhrzeit frei eingeben ---------- */
const pad = (n) => String(n).padStart(2, "0");
const validDay = (y, mo, d) => { const x = new Date(Date.UTC(y, mo - 1, d)); return x.getUTCFullYear() === y && x.getUTCMonth() === mo - 1 && x.getUTCDate() === d ? `${y}-${pad(mo)}-${pad(d)}` : null; };
/** Liest 15.4.27 · 15.04.2027 · 15.4. · 15 4 · 150427 · 2027-04-15; ohne Jahr gilt das Jahr der Reise. "" = leer, null = nicht erkannt. */
function parseDateDE(v, refYear) {
  const x = String(v ?? "").trim();
  if (!x) return "";
  let m = x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return validDay(+m[1], +m[2], +m[3]);
  m = x.match(/^(\d{1,2})[.\/\s-](\d{1,2})(?:[.\/\s-](\d{2}|\d{4})?)?\.?$/) || x.match(/^(\d{2})(\d{2})(\d{2}|\d{4})?$/);
  if (!m) return null;
  let y = m[3] ? +m[3] : refYear;
  if (y < 100) y += 2000;
  return validDay(y, +m[2], +m[1]);
}
/** Liest 9 · 930 · 9:30 · 9.30 · 21 Uhr · 2130. "" = leer, null = nicht erkannt. */
function parseTimeDE(v) {
  const x = String(v ?? "").trim().toLowerCase().replace(/\s*(uhr|h)$/, "");
  if (!x) return "";
  const m = x.match(/^(\d{1,2})(?:[:.,\s](\d{1,2}))?$/) || x.match(/^(\d{1,2})(\d{2})$/);
  if (!m) return null;
  const h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
  return h > 23 || mi > 59 ? null : `${pad(h)}:${pad(mi)}`;
}
const isoToDe = (iso) => (iso ? `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)}` : "");
const tm = (s) => (s && s.length > 10 ? fTime(s) : "–");
const dtShort = (s) => (s ? fShort(s) + (s.length > 10 ? ", " + fTime(s) : "") : "");
/** Vergleich zweier Zeitpunkte; fehlt bei einem die Uhrzeit, zählt nur das Datum. */
const cmpDT = (a, b) => { const x = a.length > 10 && b.length > 10 ? [a, b] : [a.slice(0, 10), b.slice(0, 10)]; return x[0] < x[1] ? -1 : x[0] > x[1] ? 1 : 0; };
const fail = (f, msg) => { const el = f.querySelector("[data-err]"); if (el) { el.textContent = msg; el.hidden = false; } else { st.error = msg; render(); } };

function dtField(id, name, label, value, kind, required) {
  const shown = kind === "date" ? isoToDe(value) : value || "";
  return `<label class="f" for="${id}">${label}${required ? " *" : ""}<span class="dt">
    <input id="${id}" name="${name}" class="dt-text" data-kind="${kind}" placeholder="${kind === "date" ? "TT.MM.JJJJ" : "HH:MM"}" value="${esc(shown)}" autocomplete="off">
    <span class="pick"><span aria-hidden="true">${kind === "date" ? "📅" : "🕒"}</span><input type="${kind}" class="pick-native" data-target="${id}" aria-label="${kind === "date" ? "Kalender öffnen" : "Uhrzeit auswählen"}" tabindex="-1" value="${esc(value || "")}"></span></span></label>`;
}

/* ---------- Verkehr: Hin- und Rückreise, je mit beliebig vielen Teilstrecken (Umstiege) ---------- */
function journeyOf(id) {
  const x = db.transports.find((t) => t.id === id);
  if (!x) return [];
  const legs = x.journeyId ? db.transports.filter((t) => t.journeyId === x.journeyId) : [x];
  return legs.sort((a, b) => ((a.leg === "RETURN") - (b.leg === "RETURN")) || ((a.seg || 0) - (b.seg || 0)));
}
const splitDT = (s) => ({ d: s ? s.slice(0, 10) : "", t: s && s.length > 10 ? s.slice(11, 16) : "" });
const LEGNAME = { OUT: "Hinreise", RETURN: "Rückreise" };

/* Bezahlt-Status eines Eintrags = verknüpfte Ausgabe mit Status „bezahlt“ */
const paidExp = (id) => (id ? db.expenses.find((e) => e.sourceId === id && e.status === "PAID") : null);
function paidFields(p, id) {
  const e = paidExp(id);
  return `<label class="row" for="f-${p}paid" style="gap:8px;align-self:end;min-height:42px"><input type="checkbox" id="f-${p}paid" name="${p}paid" ${e ? "checked" : ""}><span class="small">bereits bezahlt</span></label>
    <label class="f" for="f-${p}pm">Zahlart<select id="f-${p}pm" name="${p}pm"><option value="CARD">Karte</option><option value="CASH" ${e?.paymentMethod === "CASH" ? "selected" : ""}>bar</option></select></label>`;
}
/** Häkchen „bereits bezahlt“ in eine verknüpfte Ausgabe übersetzen (oder sie entfernen) */
function syncPaid(sourceType, x, paid, pm, oldPrice, title, category) {
  const ex = db.expenses.find((e) => e.sourceId === x.id);
  const amt = num(x.price);
  if (paid && amt > 0) {
    if (ex) Object.assign(ex, { status: "PAID", paymentMethod: pm || "CARD", title, category, ...(ex.status !== "PAID" || num(oldPrice) !== amt ? { amount: String(amt) } : {}) });
    else db.expenses.push({ id: uid(), tripId: x.tripId, date: new Date().toLocaleDateString("sv-SE"), title, category, amount: String(amt), currency: "EUR", status: "PAID", paymentMethod: pm || "CARD", sourceType, sourceId: x.id, notes: "" });
  } else if (!paid && ex) db.expenses = db.expenses.filter((e) => e !== ex);
}
const transTitle = (x) => (x.type === "PARKING" ? `Parken: ${x.fromLocation}` : `${TYPES[x.type]} ${x.fromLocation} → ${x.toLocation}`);

/** Felder einer Teilstrecke; p = Präfix wie "o0_" oder "r1_", h = graue Vorschläge */
function segFields(p, v, h = {}, req) {
  const dep = splitDT(v.departAt), arr = splitDT(v.arriveAt);
  return `
    <label class="f" for="f-${p}type">Art<select id="f-${p}type" name="${p}type">${Object.entries(TYPES).map(([k, l]) => `<option value="${k}" ${(v.type || h.type || "FLIGHT") === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <label class="f" for="f-${p}carrier">Anbieter<input id="f-${p}carrier" name="${p}carrier" value="${esc(v.carrier)}" placeholder="${esc(h.carrier || "z. B. DB, Lufthansa")}"></label>
    <label class="f" for="f-${p}number">Nummer (Flug/Zug)<input id="f-${p}number" name="${p}number" value="${esc(v.number)}"></label>
    <label class="f" for="f-${p}bookingRef">Buchungscode<input id="f-${p}bookingRef" name="${p}bookingRef" value="${esc(v.bookingRef)}" placeholder="${esc(h.bookingRef || "")}"></label>
    <label class="f" for="f-${p}from">Von${req ? " *" : ""}<input id="f-${p}from" name="${p}fromLocation" value="${esc(v.fromLocation)}" placeholder="${esc(h.from || "")}"></label>
    <label class="f" for="f-${p}to">Nach${req ? " *" : ""}<input id="f-${p}to" name="${p}toLocation" value="${esc(v.toLocation)}" placeholder="${esc(h.to || "")}"></label>
    ${dtField(`f-${p}depd`, `${p}depDate`, "Abfahrt Datum", dep.d, "date", req)}
    ${dtField(`f-${p}dept`, `${p}depTime`, "Abfahrt Uhrzeit", dep.t, "time")}
    ${dtField(`f-${p}arrd`, `${p}arrDate`, "Ankunft Datum", arr.d, "date")}
    ${dtField(`f-${p}arrt`, `${p}arrTime`, "Ankunft Uhrzeit", arr.t, "time")}
    <label class="f" for="f-${p}seat">Sitzplatz<input id="f-${p}seat" name="${p}seat" value="${esc(v.seat)}"></label>
    <label class="f" for="f-${p}price">Preis (EUR)<input id="f-${p}price" name="${p}price" inputmode="decimal" value="${v.price ? fNum(v.price) : ""}"></label>
    ${paidFields(p, v.id)}
    <label class="f full" for="f-${p}notes">Notizen<textarea id="f-${p}notes" name="${p}notes" rows="2">${esc(v.notes)}</textarea></label>`;
}
function segBlock(p, v, h, req) {
  return `<div class="seg grid2" data-seg data-prefix="${p}">
    <div class="row between full"><span class="eyebrow seg-title">Teilstrecke</span><button type="button" class="link" data-act="seg-del">Teilstrecke entfernen</button></div>
    ${segFields(p, v, h, req)}</div>`;
}
/** Bei Art „Parken“ passende Beschriftungen: Parkhaus, Einfahrt, Ausfahrt, Kennzeichen */
function applyType(block) {
  const p = block.dataset.prefix, park = block.querySelector(`[name="${p}type"]`)?.value === "PARKING", req = p === "o0_" ? " *" : "";
  const set = (id, a, b) => { const lab = block.querySelector(`label[for="f-${p}${id}"]`); if (lab?.firstChild?.nodeType === 3) lab.firstChild.nodeValue = park ? b : a; };
  set("carrier", "Anbieter", "Betreiber");
  set("number", "Nummer (Flug/Zug)", "Kennzeichen");
  set("from", "Von" + req, "Parkhaus / Parkplatz" + req);
  set("to", "Nach" + req, "Adresse");
  set("depd", "Abfahrt Datum" + req, "Einfahrt Datum" + req);
  set("dept", "Abfahrt Uhrzeit", "Einfahrt Uhrzeit");
  set("arrd", "Ankunft Datum", "Ausfahrt Datum");
  set("arrt", "Ankunft Uhrzeit", "Ausfahrt Uhrzeit");
  const seat = block.querySelector(`label[for="f-${p}seat"]`); if (seat) seat.hidden = park;
  const f = block.closest("form");
  if (f && p === "o0_") {
    const only = f.querySelectorAll('[data-leg="OUT"] [data-seg]').length === 1;
    const hideMore = park && only;
    const rt = f.querySelector('[data-act="leg"][data-id="RETURN"]'); if (rt) rt.hidden = hideMore;
    f.querySelectorAll('[data-act="seg-add"]').forEach((x) => { x.hidden = hideMore; });
  }
}
function renumberSegs(legEl) {
  const blocks = [...legEl.querySelectorAll("[data-seg]")];
  blocks.forEach((b, i) => {
    b.querySelector(".seg-title").textContent = blocks.length > 1 ? `Teilstrecke ${i + 1}${i ? " · nach Umstieg" : ""}` : "Verbindung";
    b.querySelector('[data-act="seg-del"]').hidden = blocks.length === 1;
  });
}
/** Neue Teilstrecke anhängen; übernimmt Art, Anbieter, Abfahrtsort und -tag aus der vorherigen */
function addSeg(legEl, prefix) {
  const blocks = [...legEl.querySelectorAll("[data-seg]")];
  const prev = blocks[blocks.length - 1];
  const leg = legEl.dataset.leg;
  if (!prefix) prefix = (leg === "OUT" ? "o" : "r") + (Math.max(-1, ...blocks.map((b) => +b.dataset.prefix.slice(1, -1))) + 1) + "_";
  const pv = (n) => (prev ? prev.querySelector(`[name="${prev.dataset.prefix}${n}"]`)?.value.trim() || "" : "");
  const ref = +trip().startDate.slice(0, 4);
  const v = prev ? { type: pv("type"), carrier: pv("carrier"), fromLocation: pv("toLocation"), departAt: parseDateDE(pv("arrDate"), ref) || parseDateDE(pv("depDate"), ref) || "" } : {};
  legEl.querySelector("[data-segs]").insertAdjacentHTML("beforeend", segBlock(prefix, v, { bookingRef: pv("bookingRef") }, false));
  renumberSegs(legEl);
  applyType(legEl.querySelector(`[data-prefix="${prefix}"]`));
}

function transportForm(legs) {

  const retBlocks = (ret.length ? ret : [{}]).map((v, i, a) => segBlock(`r${i}_`, v, { from: i ? a[i - 1].toLocation : oL.toLocation, to: i === a.length - 1 ? o0.fromLocation : "", carrier: o0.carrier, bookingRef: o0.bookingRef, type: o0.type }, false)).join("");

      ${ret.length ? `<label class="row" for="f-r_remove" style="gap:8px"><input type="checkbox" id="f-r_remove" name="r_remove"><span class="small">Rückreise ganz entfernen</span></label>` : ""}
    </div>
    <p class="hint">Jede Teilstrecke hat eigene Tage und Uhrzeiten. Eintippen (z. B. 15.4. und 930) oder über 📅 und 🕒 auswählen. Bei Flügen schlägt die App Flughäfen und Fluggesellschaften vor; bei einer Flugnummer wie „LH 1234“ wird die Fluggesellschaft ergänzt.</p>
    <p class="err" data-err hidden></p>

  </form>`;
}

/** Liest eine Teilstrecke. Ergebnis: { empty } | { error } | { data } */
function readSeg(f, p, refYear, fb, name, required) {
  const g = (n) => (f.elements[p + n]?.value ?? "").trim();
  const filled = ["carrier", "number", "bookingRef", "fromLocation", "toLocation", "depDate", "depTime", "arrDate", "arrTime", "seat", "price", "notes"].some((n) => g(n));
  const park = g("type") === "PARKING";
  if (!filled) return required ? { error: park ? `${name}: Bitte Parkhaus und Einfahrtsdatum angeben.` : `${name}: Bitte Von, Nach und Abfahrtsdatum angeben.` } : { empty: true };
  const dd = parseDateDE(g("depDate"), refYear), dt = parseTimeDE(g("depTime"));
  let ad = parseDateDE(g("arrDate"), refYear);
  const at = parseTimeDE(g("arrTime"));
  if (dd === null || ad === null) return { error: `${name}: Datum nicht erkannt. Bitte so eingeben: 15.04.2027 oder 15.4.` };
  if (dt === null || at === null) return { error: `${name}: Uhrzeit nicht erkannt. Bitte so eingeben: 9:30 oder 930.` };
  if (!dd) return { error: `${name}: ${park ? "Einfahrtsdatum" : "Abfahrtsdatum"} fehlt.` };
  if (!ad && at) ad = dt && at < dt ? addDays(dd, 1) : dd; // Ankunft ohne Datum: gleicher Tag, über Nacht der Folgetag
  const from = g("fromLocation") || fb.fromLocation || "";
  const to = g("toLocation") || fb.toLocation || "";
  if (!from) return { error: `${name}: ${park ? "Bitte das Parkhaus angeben." : "Bitte Von und Nach angeben."}` };
  if (!to && !park) return { error: `${name}: Bitte Von und Nach angeben.` };
  const departAt = dd + (dt ? "T" + dt : "");
  const arriveAt = ad ? ad + (at ? "T" + at : "") : "";
  if (arriveAt && cmpDT(arriveAt, departAt) < 0) return { error: `${name}: ${park ? "Die Ausfahrt liegt vor der Einfahrt." : "Die Ankunft liegt vor der Abfahrt."}` };
  const pr = g("price");
  return { paid: Boolean(f.elements[p + "paid"]?.checked), pm: g("pm"), data: {
    type: g("type") || "OTHER", carrier: g("carrier") || fb.carrier || "", number: g("number"),
    bookingRef: g("bookingRef") || fb.bookingRef || "", fromLocation: from, toLocation: to,
    departAt, arriveAt, seat: g("seat"), price: pr ? String(num(pr)) : "", notes: g("notes"),
  } };
}

function saveJourney(f) {
  const ref = +trip().startDate.slice(0, 4);
  const old = st.editing === "new" ? [] : journeyOf(st.editing);
  const res = { OUT: [], RETURN: [] };
  for (const leg of ["OUT", "RETURN"]) {
    if (leg === "RETURN" && f.elements.r_remove?.checked) continue;
    const ps = [...f.querySelectorAll(`[data-leg="${leg}"] [data-seg]`)].map((b) => b.dataset.prefix);
    ps.forEach((p, i) => res[leg].push({ p, i, n: ps.length }));
  }
  const done = { OUT: [], RETURN: [] };
  for (const leg of ["OUT", "RETURN"]) {

  for (const leg of ["OUT", "RETURN"]) done[leg].forEach(({ __paid, __pm, ...d }, i) => {

}

/* ---------- Vorschläge bei Flügen: Flughäfen (OurAirports) und Fluggesellschaften (OpenFlights) ---------- */
let AP = null, AL = null, regionNames = null;
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss");
const apList = () => (AP ||= AIRPORT_DATA.split("\n").map((l) => { const [iata, city, name, cc, kw, rank] = l.split("|"); return { iata, city, name, cc, rank: +rank || 0, hay: " " + norm(`${iata} ${city} ${name} ${kw}`), c: norm(city) }; }));

function suggestAirports(q) {
  const n = norm(q.trim()), up = q.trim().toUpperCase();
  if (n.length < 2) return [];

    const s = a.iata === up ? 0 : a.c.startsWith(n) ? 1 : a.hay.includes(" " + n) ? 2 : n.length >= 3 && a.hay.includes(n) ? 3 : -1;
    if (s >= 0) hits.push([s * 10 + a.rank, a]);
  }
  return hits.sort((x, y) => x[0] - y[0]).slice(0, 8).map(([, a]) => ({ value: `${a.city} (${a.iata})`, label: `<b>${esc(a.city)} (${a.iata})</b><span class="muted small"> ${esc(a.name)} · ${esc(countryDe(a.cc))}</span>` }));
}
function suggestAirlines(q) {

  const hits = [];
  for (const a of alList()) {
    const s = a.iata === up ? 0 : a.n.startsWith(n) ? 1 : a.hay.includes(" " + n) ? 2 : n.length >= 3 && a.hay.includes(n) ? 3 : -1;
    if (s >= 0) hits.push([s * 10 + (a.cargo ? 5 : 0), a]);

  return hits.sort((x, y) => x[0] - y[0]).slice(0, 8).map(([, a]) => ({ value: a.name, label: `<b>${esc(a.name)}</b><span class="muted small"> ${a.iata}${a.country ? " · " + esc(a.country) : ""}</span>` }));

/* ---------- Zeitverschiebung ---------- */
const TZ_OPTIONS = Array.from({ length: 53 }, (_, i) => -12 + i * 0.5);
const fmtOff = (o) => (o === 0 ? "keine" : `${o > 0 ? "+" : "−"}${String(Math.abs(o)).replace(".", ",")} Std.`);
/** Ortszeit am Reiseziel → Uhrzeit zu Hause */
function homeTime(hhmm, off) {
  if (!hhmm || !off) return "";
  let m = +hhmm.slice(0, 2) * 60 + +hhmm.slice(3, 5) - Math.round(off * 60), shift = "";
  if (m < 0) { m += 1440; shift = " (Vortag)"; } else if (m >= 1440) { m -= 1440; shift = " (Folgetag)"; }
  return `${pad(Math.floor(m / 60))}:${pad(m % 60)}${shift}`;
}

/** Aufenthalt am Reiseziel: von der Landung des (letzten) Hinflugs bis zum Abflug des (ersten) Rückflugs.
    Ohne Flüge: Ankunft und Rückfahrt der Verbindungen mit Rückreise; sonst die Reisetage. Parken zählt nie. */
function destWindow(t) {
  const legs = of("transports").filter((x) => x.type !== "PARKING");
  const flights = legs.filter((x) => x.type === "FLIGHT");
  const base = flights.length ? flights : legs.filter((x) => journeyOf(x.id).some((l) => l.leg === "RETURN"));
  const outs = base.filter((x) => x.leg !== "RETURN"), rets = base.filter((x) => x.leg === "RETURN");
  return [outs.length ? outs.map((x) => x.arriveAt || x.departAt).sort().pop() : t.startDate, rets.length ? rets.map((x) => x.departAt).sort()[0] : t.endDate + "T23:59"];
}
/** Uhrzeit zu Hause für einen Zeitpunkt – oder "" wenn nicht am Reiseziel / ohne Zeitverschiebung.
    kind "transport": nur innerhalb des Aufenthalts; sonst: an Reisetagen. */
function homeAt(t, at, kind, type) {
  const off = num(t.tzOffset);
  if (!off || !at || at.length <= 10 || type === "PARKING") return "";
  if (kind === "transport") { const [a, b] = destWindow(t); if (cmpDT(at, a) < 0 || cmpDT(at, b) > 0) return ""; }
  else if (at.slice(0, 10) < t.startDate || at.slice(0, 10) > t.endDate) return "";
  return homeTime(at.slice(11, 16), off);
}

/* ---------- Auf einen Blick ---------- */
function glance(t) {
  const rows = [];
  for (const x of of("transports").sort(SORT.transports)) {
    if (x.type === "PARKING") rows.push({ at: x.departAt, icon: "🅿", title: `Parken: ${x.fromLocation}`, when: `${dtShort(x.departAt)}${x.arriveAt ? " – " + dtShort(x.arriveAt) : ""}`, codes: [["Buchung", x.bookingRef], ["Kennzeichen", x.number]], addr: x.toLocation !== x.fromLocation ? x.toLocation : x.fromLocation });
    else rows.push({ home: homeAt(t, x.departAt, "transport", x.type), at: x.departAt, icon: TYPE_ICON[x.type], title: `${x.fromLocation} → ${x.toLocation}`, when: `${dtShort(x.departAt)}${[x.carrier, x.number].filter(Boolean).length ? " · " + [x.carrier, x.number].filter(Boolean).join(" ") : ""}`, codes: [["Buchung", x.bookingRef], ["Sitz", x.seat]] });
  }
  for (const a of of("accommodations")) rows.push({ home: [homeAt(t, a.checkIn), homeAt(t, a.checkOut)].some(Boolean) ? `${homeAt(t, a.checkIn) || "–"} – ${homeAt(t, a.checkOut) || "–"}` : "", at: a.checkIn, icon: "🏨", title: a.name, when: `${dtShort(a.checkIn)} – ${dtShort(a.checkOut)}`, codes: [["Buchung", a.bookingRef], ["Telefon", a.phone]], addr: a.address });
  for (const e of of("excursions")) rows.push({ home: homeAt(t, e.date + (e.startTime ? "T" + e.startTime : "")), at: e.date + (e.startTime ? "T" + e.startTime : ""), icon: "🎟", title: e.title, when: `${fShort(e.date)}${e.startTime ? ", " + e.startTime : ""}`, codes: [["Buchung", e.bookingRef], ["Telefon", e.phone]], addr: e.meetingPoint });
  rows.sort((a, b) => a.at.localeCompare(b.at));
  if (!rows.length) return "";
  return `<div class="panel stack glance" style="gap:0"><div class="row between"><h2>Auf einen Blick</h2><span class="hint">Code antippen = kopieren · 📍 = Route</span></div>
    ${rows.map((r) => `<div class="glance-row"><span class="g-ico">${r.icon}</span><div class="g-main"><b>${esc(r.title)}</b><span class="meta">${esc(r.when)}</span>${r.home ? `<span class="meta">🏠 zu Hause ${esc(r.home)}</span>` : ""}${r.addr ? mapLink(r.addr) : ""}</div>
      <div class="g-codes">${r.codes.filter((c) => c[1]).map(([k, v]) => `<span class="g-code"><span class="eyebrow">${k}</span>${copyBtn(v)}</span>`).join("")}</div></div>`).join("")}</div>`;
}

function packTakeover(src) {
  const have = new Set(of("packing").map((i) => i.name.toLowerCase()));
  let list = [];
  if (src.startsWith("tpl:")) list = (PACK_TEMPLATES[src.slice(4)] || []).map(([name, category]) => ({ name, category, quantity: 1 }));
  else if (src.startsWith("trip:")) list = db.packing.filter((i) => i.tripId === src.slice(5)).map((i) => ({ name: i.name, category: i.category, quantity: i.quantity }));
  let n = 0;
  for (const i of list) if (!have.has(i.name.toLowerCase())) { db.packing.push({ id: uid(), tripId: st.tripId, ...i, packed: false }); have.add(i.name.toLowerCase()); n++; }
  return n;
}

function readEmergency(f) {
  const g = (n) => (f.elements[n]?.value ?? "").trim();
  const persons = [];
  for (const b of f.querySelectorAll("[data-person]")) {
    const pp = b.dataset.prefix;
    let birth = parseDateDE(g(pp + "birth"), 1950);
    if (birth && birth > new Date().toLocaleDateString("sv-SE")) birth = String(+birth.slice(0, 4) - 100) + birth.slice(4);
    if (birth === null) return { error: "Geburtsdatum nicht erkannt. Bitte so eingeben: 03.05.1958." };
    const p = { name: g(pp + "name"), birth, blood: g(pp + "blood"), donor: g(pp + "donor"), allergies: g(pp + "allergies"), conditions: g(pp + "conditions"), doctorName: g(pp + "doctorName"), doctorPhone: g(pp + "doctorPhone"), insName: g(pp + "insName"), insNumber: g(pp + "insNumber"), tiName: g(pp + "tiName"), tiNumber: g(pp + "tiNumber"), tiPhone: g(pp + "tiPhone"), lang: g(pp + "lang"), notes: g(pp + "notes"), meds: [], vacc: [], contacts: [] };
    for (const [key, target] of [["m", "meds"], ["v", "vacc"], ["c", "contacts"]]) for (const r of b.querySelectorAll(`[data-list="${key}"] [data-row]`)) {
      const rp = r.dataset.prefix, o = {};
      for (const [k, , type] of ROWS[key].fields) {
        if (type === "date") { const d = parseDateDE(g(rp + k), new Date().getFullYear()); if (d === null) return { error: `${ROWS[key].title}: Datum nicht erkannt. Bitte so eingeben: 15.04.2024.` }; o[k] = d; }
        else o[k] = g(rp + k);
      }
      if (Object.values(o).some(Boolean)) p[target].push(o);
    }
    if (Object.entries(p).some(([k, v]) => (Array.isArray(v) ? v.length : v))) persons.push(p);
  }
  return { persons, trip: { local: g("t_local"), embassy: g("t_embassy"), embassyPhone: g("t_embphone"), hospital: g("t_hospital"), notes: g("t_notes") } };
}

/* ---------- Sicherungsdatei ---------- */
function backupData() {
  return { app: "Reiseplaner", format: 1, created: new Date().toISOString(), trips: db.trips.map((t) => bundle(t.id)), profile };

function importBackup(text) {
  let d;

  if (d?.app !== "Reiseplaner" || !Array.isArray(d.trips)) return "Die Datei ist keine Reiseplaner-Sicherung.";
  let added = 0, skipped = 0;
  for (const b of d.trips) {
    if (!b?.trip?.id) continue;
    if (db.trips.some((t) => t.id === b.trip.id)) { skipped++; continue; }
    db.trips.push(b.trip);
    for (const k of COLLS) db[k].push(...(Array.isArray(b[k]) ? b[k] : []));
    added++;
  }
  let prof = "";
  if (d.profile?.persons?.length) {
    if (!profile.persons?.length) { profile = d.profile; saveProfile(); prof = " Notfalldaten übernommen."; }
    else prof = " Vorhandene Notfalldaten wurden nicht überschrieben.";
  }
  save();
  return `${added} ${added === 1 ? "Reise" : "Reisen"} übernommen${skipped ? `, ${skipped} schon vorhanden und unverändert gelassen` : ""}.${prof}`;
}

/* ---------- Tagesplan: Einträge aus allen Reitern automatisch ---------- */
const SRC_LABEL = { transports: "Verkehr", parking: "Verkehr", accommodations: "Unterkunft", excursions: "Ausflug" };
function autoItems() {
  const out = [];
  for (const x of of("transports")) {
    const dep = splitDT(x.departAt), arr = splitDT(x.arriveAt);
    const same = arr.d === dep.d;
    if (x.type === "PARKING") {
      out.push({ type: "PARKING", date: dep.d, start: dep.t, end: "", icon: "🅿", title: `Einfahrt: ${x.fromLocation}`, sub: [x.toLocation !== x.fromLocation && x.toLocation, x.bookingRef && "Buchung " + x.bookingRef].filter(Boolean).join(" · "), src: "transports" });
      if (arr.d) out.push({ type: "PARKING", date: arr.d, start: arr.t, end: "", icon: "🅿", title: `Ausfahrt: ${x.fromLocation}`, sub: "", src: "transports" });
      continue;
    }
    const what = [TYPES[x.type], x.carrier, x.number].filter(Boolean).join(" ");
    out.push({ type: x.type, date: dep.d, start: dep.t, end: arr.d && same ? arr.t : "", icon: TYPE_ICON[x.type], title: `${x.fromLocation} → ${x.toLocation}`, sub: what + (arr.d && !same ? ` · Ankunft ${dtShort(x.arriveAt)}` : ""), src: "transports" });
    if (arr.d && !same) out.push({ type: x.type, arrival: true, date: arr.d, start: arr.t, end: "", icon: TYPE_ICON[x.type], title: `Ankunft in ${x.toLocation}`, sub: what, src: "transports" });
  }
  for (const a of of("accommodations")) {
    const ci = splitDT(a.checkIn), co = splitDT(a.checkOut);
    out.push({ date: ci.d, start: ci.t, end: "", icon: "🏨", title: `Check-in: ${a.name}`, sub: a.address || "", src: "accommodations" });
    for (let d = addDays(ci.d, 1), k = 0; d < co.d && k < 400; d = addDays(d, 1), k++) out.push({ date: d, start: "", end: "", icon: "🛏", title: `Übernachtung: ${a.name}`, sub: "", src: "accommodations" });
    if (co.d !== ci.d) out.push({ date: co.d, start: co.t, end: "", icon: "🧳", title: `Check-out: ${a.name}`, sub: "", src: "accommodations" });
  }
  for (const x of of("parking")) {
    const a = splitDT(x.startAt), b = splitDT(x.endAt);
    out.push({ date: a.d, start: a.t, end: "", icon: "🅿", title: `Einfahrt: ${x.name}`, sub: [x.address, x.bookingRef && "Buchung " + x.bookingRef].filter(Boolean).join(" · "), src: "parking" });
    out.push({ date: b.d, start: b.t, end: "", icon: "🅿", title: `Ausfahrt: ${x.name}`, sub: "", src: "parking" });
  }
  for (const e of of("excursions")) out.push({ date: e.date, start: e.startTime || "", end: e.endTime || "", icon: "🎟", title: e.title, sub: [e.meetingPoint && "Treffpunkt: " + e.meetingPoint, e.provider].filter(Boolean).join(" · "), src: "excursions" });
  return out;
}
/** Alle Tage für den Tagesplan: Reisetage plus Tage davor/danach, an denen etwas ansteht */
function planDays(t, auto) {
  const extra = [...new Set(auto.map((a) => a.date).filter((d) => d && (d < t.startDate || d > t.endDate)))].sort();
  const trip = days(t.startDate, t.endDate);
  return [
    ...extra.filter((d) => d < t.startDate).map((d) => ({ d, label: "Vor der Reise", inTrip: false })),
    ...trip.map((d, i) => ({ d, label: `Tag ${i + 1}`, inTrip: true })),
    ...extra.filter((d) => d > t.endDate).map((d) => ({ d, label: "Nach der Reise", inTrip: false })),
  ];
}
function dayList(d, items, auto) {
  return [
    ...auto.filter((a) => a.date === d).map((a) => ({ own: false, a, key: a.start || "" })),
    ...items.filter((x) => x.date === d).map((x) => ({ own: true, x, key: x.startTime || "99" })),
  ].sort((p, q) => p.key.localeCompare(q.key));
}

const DRAFT = KEY + ".entwurf";
let draftTimer = null;
const clearDraft = () => { clearTimeout(draftTimer); try { localStorage.removeItem(DRAFT); } catch {} };
function saveDraft() {
  const forms = [...$app.querySelectorAll("form[data-form]")].filter((f) => f.dataset.form !== "days").map((f) => {
    const vals = {};
    f.querySelectorAll("input[id], select[id], textarea[id]").forEach((el) => { if (!el.classList.contains("pick-native")) vals[el.id] = el.type === "checkbox" ? el.checked : el.value; });
    const structure = [...f.querySelectorAll("[data-prefix]")].map((b) => ({ leg: b.closest("[data-leg]")?.dataset.leg || "", prefix: b.dataset.prefix }));
    return { kind: f.dataset.form, day: f.dataset.day || "", id: f.dataset.id || "", vals, structure };
  });
  const s = { tripId: st.tripId, tab: st.tab, editing: st.editing, tripForm: st.tripForm, openDay: st.openDay, leg: st.leg, budgetOpen: st.budgetOpen, payId: st.payId, emEdit: st.emEdit, emGlobal: st.emGlobal };
  try { localStorage.setItem(DRAFT, JSON.stringify({ at: Date.now(), st: s, forms })); } catch {}
}
function onDraft() { dirty = true; clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 300); }
function restoreDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DRAFT)); } catch {}
  if (!d || !d.st || Date.now() - d.at > 14 * 864e5) return;
  if (d.st.tripId && !db.trips.some((t) => t.id === d.st.tripId)) { clearDraft(); return; }
  if (d.st.editing && !String(d.st.editing).startsWith("new") && !COLLS.some((k) => db[k].some((x) => x.id === d.st.editing))) { clearDraft(); return; }
  Object.assign(st, d.st);
  if (st.tab === "export" && st.tripId) st.rep = repDefaults(trip());
  render();
  let changed = 0;
  for (const fs of d.forms || []) {
    const f = $app.querySelector(`form[data-form="${fs.kind}"]${fs.day ? `[data-day="${fs.day}"]` : ""}${fs.id ? `[data-id="${fs.id}"]` : ""}`);
    if (!f) continue;
    if (fs.kind === "transports" || fs.kind === "accommodations") {
      const want = new Set(fs.structure.map((x) => x.prefix));
      f.querySelectorAll("[data-prefix]").forEach((b) => { if (!want.has(b.dataset.prefix)) b.remove(); });
      for (const sx of fs.structure) {
        if (f.querySelector(`[data-prefix="${sx.prefix}"]`)) continue;
        if (fs.kind === "transports") { const legEl = f.querySelector(`[data-leg="${sx.leg}"]`); if (legEl) addSeg(legEl, sx.prefix); }
        else addStay(f, sx.prefix);
      }
      f.querySelectorAll("[data-leg]").forEach(renumberSegs);
      if (fs.kind === "accommodations") renumberStays(f);
    } else if (fs.kind === "emergency") {
      const want = new Set(fs.structure.map((x) => x.prefix));
      f.querySelectorAll("[data-prefix]").forEach((b) => { if (!want.has(b.dataset.prefix)) b.remove(); });
      for (const sx of fs.structure) {
        if (f.querySelector(`[data-prefix="${sx.prefix}"]`)) continue;
        if (/^p\d+_$/.test(sx.prefix)) emAddPerson(f, sx.prefix);
        else { const pp = sx.prefix.match(/^p\d+_/)[0]; const pe = f.querySelector(`[data-person][data-prefix="${pp}"]`); if (pe) emAddRow(pe, sx.prefix[pp.length], sx.prefix); }
      }
    }
    for (const [id, v] of Object.entries(fs.vals)) {
      const el = document.getElementById(id);
      if (!el || !f.contains(el)) continue;
      if (el.type === "checkbox") { if (el.checked !== v) { el.checked = v; changed++; } }
      else if (el.value !== v) { el.value = v; changed++; }
    }
  }
  if (!changed) { if (!st.editing && !st.tripForm && !st.openDay && !st.payId && !st.emEdit) clearDraft(); return; }
  dirty = true;
  $app.insertAdjacentHTML("afterbegin", `<div class="banner" id="draft-note" style="margin-bottom:14px"><span class="small">Entwurf wiederhergestellt: Deine noch nicht gespeicherten Eingaben sind wieder da.</span><button class="ghost" data-act="draft-discard">Verwerfen</button></div>`);
}

  if (kind === "transports" && o.arriveAt && o.arriveAt < o.departAt) return "Ankunft liegt vor der Abfahrt.";

    <div class="stats">${stat(of("transports").length, "Fahrten")}${stat(of("excursions").length, "Ausflüge")}${stat(of("accommodations").length, "Unterkünfte")}${stat(`${pl.filter((p) => p.visited).length}/${pl.length}`, "Orte besucht")}${stat(`${pk.filter((p) => p.packed).length}/${pk.length}`, "gepackt")}${(() => { const b = budgetSummary(t); const used = b.paid + b.planned; return b.budget ? stat(fEur0(used), `von ${fEur0(b.budget)} ${lamp(used, b.budget, true)}`) : stat(fEur0(b.paid), "ausgegeben"); })()}</div>
    ${num(t.tzOffset) ? `<div class="panel small">🕒 Am Reiseziel ist es ${fmtOff(Math.abs(num(t.tzOffset))).replace("+", "")} ${num(t.tzOffset) > 0 ? "später" : "früher"} als zu Hause. Unter den Uhrzeiten vor Ort steht mit 🏠 die Zeit zu Hause. Fahrten und Transfers zählen ab der Landung bis zum Rückflug dazu; Flüge davor und danach sowie das Parken nicht, deren Zeiten gelten am jeweiligen Ort.</div>` : ""}
    ${t.notes ? `<div class="panel small" style="white-space:pre-line">${esc(t.notes)}</div>` : ""}
    ${glance(t)}
    <h2>Zeitleiste</h2>
    ${ev.length ? Object.entries(byDay).map(([d, list]) => `<div class="panel timeline"><span class="eyebrow">${fDate(d)}</span><ol>${list.map((e) => `<li><span class="time">${e.notime ? "" : fTime(e.at)}${e.home ? `<span class="hometime">🏠 ${esc(e.home)}</span>` : ""}</span><span>${e.icon}</span><span><b>${esc(e.text)}</b>${e.sub ? ` <span class="muted small">${esc(e.sub)}</span>` : ""}</span></li>`).join("")}</ol></div>`).join("") : `<p class="empty">Noch keine Termine. Füge Verkehrsmittel, Unterkünfte oder Tagesplan-Einträge hinzu.</p>`}
  </div>`;
}

function formBlock(kind, v) {
  return `<form class="panel grid2" data-form="${kind}">${fieldsHtml(kind, v)}
    ${kind === "accommodations" ? `<p class="hint full">Datum und Uhrzeit kannst du eintippen (z. B. 15.4. und 14) oder über 📅 und 🕒 auswählen.</p>` : ""}
    <p class="err full" data-err hidden></p>
    <div class="row full"><button>Speichern</button><button type="button" class="ghost" data-act="cancel">Abbrechen</button></div></form>`;
}

function actions(kind, id, question = "Löschen?") {
  if (st.confirmDel === id) return `<div class="confirm">${question} <button class="danger" data-act="del-yes" data-kind="${kind}" data-id="${id}">Ja</button><button class="link" data-act="del-no">Nein</button></div>`;
  return `<div class="actions"><button class="link" data-act="edit" data-id="${id}">Bearbeiten</button><button class="link" data-act="del" data-id="${id}">Löschen</button></div>`;
}

function viewList(kind) {
  const titles = { transports: ["Verkehrsmittel", "Noch keine Flüge, Züge oder Fahrten erfasst."], accommodations: ["Unterkünfte", "Noch keine Unterkunft erfasst."], places: ["Sehenswürdigkeiten", "Noch keine Sehenswürdigkeiten gesammelt."], excursions: ["Gebuchte Ausflüge", "Noch keine Ausflüge erfasst."] };
  const items = of(kind).sort(SORT[kind]);
  const card = (x, paired) => {
    if (st.editing === x.id) return formFor(kind, x);
    if (kind === "transports" && x.type === "PARKING") return `<div class="item"><div class="body"><div class="row" style="gap:8px"><span class="chip">🅿 Parken</span><b>${esc(x.fromLocation)}</b>${x.carrier ? `<span class="small muted">${esc(x.carrier)}</span>` : ""}</div>
        ${mapLink(x.toLocation && x.toLocation !== x.fromLocation ? x.toLocation : x.fromLocation)}
        <span class="small">Einfahrt ${dtShort(x.departAt)}${x.arriveAt ? ` – Ausfahrt ${dtShort(x.arriveAt)}` : ""}</span>
        <span class="meta">${[x.bookingRef && `Buchung <span class="mono">${esc(x.bookingRef)}</span>`, x.number && `Kennzeichen ${esc(x.number)}`, num(x.price) && fMoney(num(x.price))].filter(Boolean).join(" · ")}</span>
        ${x.notes ? `<span class="meta">${esc(x.notes)}</span>` : ""}</div>${actions(kind, x.id)}</div>`;
    if (kind === "transports") return `<div class="ticket"><div class="main">
        <div class="row">${paired ? `<span class="chip leg">${legLabel(x)}</span>` : ""}<span class="chip">${TYPE_ICON[x.type]} ${TYPES[x.type]}</span><span class="small muted">${esc([x.carrier, x.number].filter(Boolean).join(" · "))}</span></div>
        <div class="route"><div><div class="t">${tm(x.departAt)}</div><div class="p">${esc(x.fromLocation)}</div><div class="meta">${fShort(x.departAt)}</div></div>
        <span class="arrow">→</span>
        <div class="to"><div class="t">${tm(x.arriveAt)}</div><div class="p">${esc(x.toLocation)}</div><div class="meta">${x.arriveAt ? fShort(x.arriveAt) : ""}</div></div></div>
        ${x.notes ? `<div class="meta">${esc(x.notes)}</div>` : ""}</div>
        <div class="stub"><div style="text-align:right">${x.bookingRef ? `<div class="eyebrow">Buchung</div><div class="mono">${esc(x.bookingRef)}</div>` : ""}${x.seat ? `<div class="eyebrow" style="margin-top:6px">Sitz</div><div class="mono">${esc(x.seat)}</div>` : ""}${num(x.price) ? `<div class="eyebrow" style="margin-top:6px">Preis</div><div class="mono">${fMoney(num(x.price))}</div>` : ""}</div>${actions(kind, x.id, paired ? "Ganze Verbindung löschen (alle Teilstrecken)?" : "Löschen?")}</div></div>`;
    if (kind === "accommodations") return `<div class="item"><div class="body"><h3>${esc(x.name)}</h3>${mapLink(x.address)}
        <span class="small">${dtShort(x.checkIn)} – ${dtShort(x.checkOut)} · ${(() => { const n = Math.max(1, Math.round((D(x.checkOut.slice(0, 10)) - D(x.checkIn.slice(0, 10))) / 864e5)); return n === 1 ? "1 Nacht" : n + " Nächte"; })()}</span>
        <span class="meta">${[x.bookingRef && `Buchung <span class="mono">${esc(x.bookingRef)}</span>`, x.phone && `Tel. ${esc(x.phone)}`, num(x.price) && fMoney(num(x.price))].filter(Boolean).join(" · ")}</span>
        ${x.notes ? `<span class="meta">${esc(x.notes)}</span>` : ""}${x.url ? `<a class="small" href="${esc(x.url)}" target="_blank" rel="noreferrer">Website öffnen</a>` : ""}</div>${actions(kind, x.id)}</div>`;
    if (kind === "excursions") return `<div class="item"><div class="body"><div class="row" style="gap:8px"><span class="chip">${fShort(x.date)}${x.startTime ? ", " + x.startTime + (x.endTime ? "–" + x.endTime : "") : ""}</span><b>${esc(x.title)}</b></div>
        ${x.meetingPoint ? `<span class="small muted">Treffpunkt: ${mapLink(x.meetingPoint)}</span>` : ""}
        <span class="meta">${[esc(x.provider || ""), x.bookingRef && `Buchung <span class="mono">${esc(x.bookingRef)}</span>`, x.persons && `${esc(x.persons)} Pers.`, x.phone && `Tel. ${esc(x.phone)}`, num(x.price) && fMoney(num(x.price))].filter(Boolean).join(" · ")}</span>
        ${x.notes ? `<span class="meta">${esc(x.notes)}</span>` : ""}${x.url ? `<a class="small" href="${esc(x.url)}" target="_blank" rel="noreferrer">Website öffnen</a>` : ""}</div>${actions(kind, x.id)}</div>`;
    return `<div class="item"><input type="checkbox" id="v-${x.id}" data-act="visit" data-id="${x.id}" ${x.visited ? "checked" : ""} aria-label="besucht">
        <div class="body"><div class="row" style="gap:8px"><b class="${x.visited ? "done" : ""}">${esc(x.name)}</b>${x.category ? `<span class="chip">${esc(x.category)}</span>` : ""}</div>
        ${mapLink(x.address)}${x.notes ? `<span class="meta">${esc(x.notes)}</span>` : ""}</div>${actions(kind, x.id)}</div>`;
  };
  return `<div class="stack"><div class="row between"><h2>${titles[kind][0]}</h2>${st.editing ? "" : `<button data-act="add">+ Hinzufügen</button>`}</div>
    ${st.editing === "new" ? formFor(kind, null) : ""}
    ${items.length || st.editing === "new" ? "" : `<p class="empty">${titles[kind][1]}</p>`}
    ${kind === "transports" ? journeys(items).map((g) => (g.some((l) => l.id === st.editing) ? transportForm(g) : `<div class="journey">${g.map((l, i) => (i ? layover(g[i - 1], l) : "") + card(l, g.length > 1)).join("")}</div>`)).join("")
      : kind === "accommodations" ? items.map((x, i) => (i && items[i - 1].checkOut.slice(0, 10) === x.checkIn.slice(0, 10) && st.editing !== x.id ? `<div class="layover">↳ Wechsel am ${fShort(x.checkIn)}</div>` : "") + card(x)).join("")
      : items.map((x) => card(x)).join("")}
</div>`;
}

const legLabel = (x) => { const g = journeyOf(x.id).filter((l) => (l.leg === "RETURN") === (x.leg === "RETURN")); return LEGNAME[x.leg === "RETURN" ? "RETURN" : "OUT"] + (g.length > 1 ? ` · ${(x.seg || 0) + 1}/${g.length}` : ""); };
function formFor(kind, x) {
  if (kind === "transports") return transportForm(x ? journeyOf(x.id) : []);
  if (kind === "accommodations") return stayForm(x);
  if (kind === "excursions") return excursionForm(x);
  return formBlock(kind, x || {});
}

function journeys(items) {
  const seen = new Set(), out = [];
  for (const x of items) {
    if (seen.has(x.id)) continue;
    const g = journeyOf(x.id);
    g.forEach((l) => seen.add(l.id));
    out.push(g);
  }
  return out;
}

function viewItinerary() {
  const t = trip(); const items = of("itinerary"); const places = of("places"); const auto = autoItems();
  const all = days(t.startDate, t.endDate);
  const lastUsed = items.reduce((m, x) => (x.date > m ? x.date : m), "");
  const minDays = lastUsed ? days(t.startDate, lastUsed).length : 1;
  const off = num(t.tzOffset);
  const ht = (time, inTrip) => (inTrip && off && time ? `<span class="hometime">🏠 ${homeTime(time, off)}</span>` : "");
  const own = (x, inTrip) => `<div class="slot"><span class="time">${x.startTime || "–"}${x.endTime ? "–" + x.endTime : ""}${ht(x.startTime, inTrip)}</span><span><b>${esc(x.title)}</b>${x.placeId ? ` <span class="small muted">📍 ${esc(places.find((p) => p.id === x.placeId)?.name)}</span>` : ""}${x.notes ? `<br><span class="meta">${esc(x.notes)}</span>` : ""}</span>
        ${st.confirmDel === x.id ? `<span class="confirm"><button class="danger" data-act="del-yes" data-kind="itinerary" data-id="${x.id}">Löschen</button><button class="link" data-act="del-no">Nein</button></span>` : `<button class="link" data-act="del" data-id="${x.id}" aria-label="Löschen">✕</button>`}</div>`;
  const au = (a, inTrip) => `<div class="slot auto"><span class="time">${a.start ? a.start + (a.end ? "–" + a.end : "") : "–"}${a.src === "transports" ? (a.start && homeAt(t, `${a.date}T${a.start}`, "transport", a.type) ? `<span class="hometime">🏠 ${homeAt(t, `${a.date}T${a.start}`, "transport", a.type)}</span>` : "") : ht(a.start, inTrip)}</span><span>${a.icon} <b>${esc(a.title)}</b>${a.sub ? `<br><span class="meta">${esc(a.sub)}</span>` : ""}</span><button class="link" data-act="tab" data-id="${a.src === "parking" ? "transports" : a.src}">${SRC_LABEL[a.src]} ›</button></div>`;
  const form = (d) => `<form class="grid2" data-form="itinerary" data-day="${d}">
        <label class="f full" for="i-title">Was? *<input id="i-title" name="title" required></label>
        ${dtField("i-s", "startTime", "Von", "", "time")}
        ${dtField("i-e", "endTime", "Bis", "", "time")}
        <label class="f full" for="i-p">Sehenswürdigkeit<select id="i-p" name="placeId"><option value="">– ohne –</option>${places.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label>
        <label class="f full" for="i-n">Notiz<input id="i-n" name="notes"></label>
        <p class="err full" data-err hidden></p>
        <div class="row full"><button>Speichern</button><button type="button" class="ghost" data-act="cancel">Abbrechen</button></div></form>`;
  return `<div class="stack"><div class="row between"><h2>Tagesplan</h2>
    <form class="row" data-form="days" style="gap:8px">
      <label class="f" for="i-days" style="flex-direction:row;align-items:center;gap:8px">Anzahl Tage
        <input id="i-days" name="days" type="number" min="${minDays}" max="366" value="${all.length}" style="width:84px"></label>
      <button class="ghost">Übernehmen</button></form></div>
    <span class="small muted">${fDate(t.startDate)} bis ${fDate(t.endDate)}. Fahrten, Unterkünfte und Ausflüge erscheinen automatisch (gestrichelt); ändern kannst du sie in ihrem Reiter.</span>
    ${st.error && !st.openDay ? `<p class="err">${esc(st.error)}</p>` : ""}
    ${planDays(t, auto).map(({ d, label, inTrip }) => {
      const list = dayList(d, items, auto);
      return `<div class="panel day stack" style="gap:8px"><div class="row between"><h3>${label} <span class="muted small" style="font-family:var(--body)">· ${fDate(d)}</span></h3>${inTrip && st.openDay !== d ? `<button class="ghost" data-act="add-day" data-id="${d}">+ Eintrag</button>` : ""}</div>
      ${list.length || st.openDay === d ? "" : `<span class="small muted">Noch nichts geplant.</span>`}
      ${list.map((it) => (it.own ? own(it.x, inTrip) : au(it.a, inTrip))).join("")}
      ${st.openDay === d ? form(d) : ""}
    </div>`;
    }).join("")}
    ${all.length < 366 ? `<button class="ghost" data-act="add-trip-day" style="align-self:flex-start">+ Weiteren Tag anhängen (Tag ${all.length + 1})</button>` : ""}</div>`;
}

function budgetForm(t, s) {
  return `<form class="panel grid2" data-form="budget">
    <span class="eyebrow full">Budget und Währung</span>
    <label class="f" for="b-total">Gesamtbudget (EUR)<input id="b-total" name="budgetTotal" inputmode="decimal" value="${s.total ? fNum(s.total) : ""}" placeholder="${s.catSum ? "leer = Summe der Teilbudgets" : "z. B. 1.500"}"></label>
    <span></span>
    <label class="f" for="b-fc">Fremdwährung<select id="b-fc" name="foreignCurrency">${currencyOptions(t.foreignCurrency || "")}</select></label>
    <label class="f" for="b-fx">Kurs: 1 EUR = … (in Fremdwährung)<input id="b-fx" name="fxRate" inputmode="decimal" value="${t.fxRate ? fNum(t.fxRate) : ""}" placeholder="z. B. 0,94"></label>
    <span class="eyebrow full" style="margin-top:6px">Teilbudgets je Kategorie (freiwillig)</span>
    ${s.cats.map((c, i) => `<label class="f" for="b-c${i}">${esc(c.name)}<input id="b-c${i}" name="cb:${esc(c.name)}" inputmode="decimal" value="${c.budget ? fNum(c.budget) : ""}"></label>`).join("")}

    <div class="row full"><button>Speichern</button><button type="button" class="ghost" data-act="budget-toggle">Abbrechen</button></div></form>`;
}

function expenseRow(e) {
  const orig = e.currency && e.currency !== "EUR" ? `<span class="meta">${fNum(e.amount)} ${esc(e.currency)}</span>` : "";
  const src = e.sourceType ? `<span class="meta">· aus ${{ accommodations: "Unterkünften", transports: "Verkehr", parking: "Parken", excursions: "Ausflügen" }[e.sourceType] || "Verkehr"}</span>` : "";
  let act;
  if (st.payId === e.id) {
    act = `<form class="row full" data-form="pay" data-id="${e.id}" style="gap:8px">
      <label class="f" for="pay-amt">Bezahlt (${esc(e.currency || "EUR")})<input id="pay-amt" name="amount" inputmode="decimal" value="${fNum(e.amount)}" style="width:120px"></label>
      <label class="f" for="pay-m">Zahlart<select id="pay-m" name="paymentMethod" style="width:auto"><option value="CARD">Karte</option><option value="CASH">bar</option></select></label>
      <button style="align-self:flex-end">Als bezahlt buchen</button><button type="button" class="link" data-act="pay-cancel" style="align-self:flex-end">Abbrechen</button>
      ${st.error ? `<p class="err full">${esc(st.error)}</p>` : ""}</form>`;
  } else {
    const left = e.status === "PLANNED" ? `<button class="link" data-act="pay" data-id="${e.id}">✓ Bezahlt</button>` : `<span class="meta">${e.paymentMethod === "CASH" ? "bar" : "Karte"}</span>`;
    const right = e.virtual ? `<span class="meta">Betrag dort ändern</span>`

      : `<button class="link" data-act="del" data-id="${e.id}">Löschen</button>`;
    act = `<div class="row full" style="gap:6px">${left}${right}</div>`;
  }
  return `<div class="exp"><div style="min-width:0"><b>${esc(e.title)}</b> <span class="chip">${esc(e.category)}</span><br><span class="meta">${e.date ? fShort(e.date) : ""}</span> ${src}</div>
    <div class="money"><b>${fMoney(e.eur)}</b><br>${orig}</div>${act}</div>`;
}

function viewExpenses() {
  const t = trip(); const s = budgetSummary(t);
  const fc = (t.foreignCurrency || "").toUpperCase();
  const nDays = days(t.startDate, t.endDate).length;
  const used = s.paid + s.planned;
  const today = new Date().toLocaleDateString("sv-SE");
  const planned = s.items.filter((e) => e.status === "PLANNED");
  const paid = s.items.filter((e) => e.status === "PAID").reverse();
  const shown = s.cats.filter((c) => c.budget || c.paid || c.planned);
  return `<div class="stack" style="gap:18px">
    <div class="row between"><h2>Ausgaben</h2>${st.budgetOpen ? "" : `<button class="ghost" data-act="budget-toggle">Budget &amp; Währung</button>`}</div>
    ${st.budgetOpen ? budgetForm(t, s) : ""}
    <div class="panel stack">
      <div class="kpis">
        <div><span class="eyebrow">Budget${s.budgetFromCats ? " (Summe Teilbudgets)" : ""}</span><b>${s.budget ? fEur0(s.budget) : "–"}</b><span class="meta">${s.budget ? inFc(t, s.budget) : ""}</span></div>
        <div><span class="eyebrow">Bezahlt</span><b>${fEur0(s.paid)}</b><span class="meta">${inFc(t, s.paid)}</span></div>
        <div><span class="eyebrow">Noch zu bezahlen</span><b>${fEur0(s.planned)}</b><span class="meta">${inFc(t, s.planned)}</span></div>
        <div><span class="eyebrow">${s.budget && used > s.budget ? "Überschritten um" : "Noch nicht verplant"}</span><b>${s.budget ? fEur0(Math.abs(s.budget - used)) : "–"}</b><span class="meta">${s.budget ? inFc(t, Math.abs(s.budget - used)) : ""}</span></div>
      </div>
      ${bar(s.paid, s.planned, s.budget)}
      <div class="row between small"><span class="muted">▮ bezahlt · ▨ noch zu bezahlen</span>${lamp(used, s.budget)}</div>
      ${s.budget ? `<span class="small muted">Budget ${fMoney(s.budget)} − bezahlt ${fMoney(s.paid)} − noch zu bezahlen ${fMoney(s.planned)} = ${used > s.budget ? "überschritten um " + fMoney(used - s.budget) : "noch nicht verplant " + fMoney(s.budget - used)}</span>` : ""}
      <span class="small muted">Ø ${fMoney(used / nDays)} pro Reisetag bei ${nDays} Tagen${s.budget ? ` · das Budget erlaubt Ø ${fMoney(s.budget / nDays)}` : ""}</span>
      ${s.budget ? "" : `<span class="small muted">Noch kein Budget festgelegt. Über „Budget &amp; Währung“ eintragen.</span>`}
      ${s.total && s.catSum > s.total ? `<span class="small" style="color:var(--warn)">Die Teilbudgets ergeben zusammen ${fMoney(s.catSum)} und liegen damit über dem Gesamtbudget von ${fMoney(s.total)}.</span>` : ""}
      ${t.foreignCurrency && num(t.fxRate) > 0 ? `<span class="small muted">Kurs: 1 EUR = ${fNum(t.fxRate)} ${esc(t.foreignCurrency)} (${esc(curName(t.foreignCurrency))})</span>` : ""}
    </div>
    <form class="panel grid2" data-form="expense">
      <span class="eyebrow full">Schnell erfassen</span>
      <label class="f" for="e-amt">Betrag *<input id="e-amt" name="amount" inputmode="decimal" required placeholder="0,00" autocomplete="off"><span class="fieldmsg" id="e-conv" aria-live="polite"></span></label>
      <label class="f" for="e-cur">Währung<select id="e-cur" name="currency">${(fc ? [fc, "EUR"] : ["EUR"]).map((c) => `<option>${esc(c)}</option>`).join("")}</select></label>
      <label class="f" for="e-cat">Kategorie<input id="e-cat" name="category" list="exp-cats" value="Essen &amp; Trinken"></label>
      <label class="f" for="e-title">Wofür?<input id="e-title" name="title" placeholder="z. B. Abendessen"></label>
      <label class="f" for="e-date">Datum<input id="e-date" name="date" type="date" value="${today}"></label>
      <label class="f" for="e-pm">Zahlart<select id="e-pm" name="paymentMethod"><option value="CARD">Karte</option><option value="CASH">bar</option></select></label>
      <datalist id="exp-cats">${s.cats.map((c) => `<option value="${esc(c.name)}">`).join("")}</datalist>
      <label class="row full" for="e-plan" style="gap:8px"><input type="checkbox" id="e-plan" name="planned"><span class="small">Noch nicht bezahlt</span></label>
      ${st.error && !st.payId && !st.budgetOpen ? `<p class="err full">${esc(st.error)}</p>` : ""}
      <div class="full"><button>Erfassen</button></div>
    </form>

}
